<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>태그 목록</title>
</head>
<body>
    <h1>전체 태그</h1>
    <ul>
        <li th:each="tag : ${tags}">
            <span th:text="${tag.tagName}">태그이름</span>
            <form th:action="@{'/book-tags/' + ${tag.tagId}}" method="post" style="display:inline;">
                <input type="hidden" name="_method" value="delete" />
                <button type="submit">삭제</button>
            </form>
        </li>
    </ul>

    <div>
        <a th:if="${page.hasPrevious()}" th:href="@{/book-tags(page=${page.number - 1})}">이전</a>
        <span>현재 페이지: <span th:text="${page.number + 1}">1</span></span>
        <a th:if="${page.hasNext()}" th:href="@{/book-tags(page=${page.number + 1})}">다음</a>
    </div>
    <a href="/book-tags/new">태그 생성하기</a>
</body>
</html>
