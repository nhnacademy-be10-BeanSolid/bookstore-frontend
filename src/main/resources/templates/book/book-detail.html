<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
  <title layout:fragment="title" th:text="${book.title} + ' 상세정보'">도서 상세</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4" style="max-width:800px;">
  <div class="card">
    <img th:src="${book.image}" class="card-img-top" alt="Book Image" style="height:250px; object-fit:cover;">
    <div class="card-body">
      <h3 class="card-title" th:text="${book.title}">도서 제목</h3>
      <div>
        <h5>카테고리</h5>
        <ul>
          <li th:each="cat : ${book.bookCategories}" th:text="${cat.categoryName}">카테고리명</li>
        </ul>
      </div>
      <div>
        <h5>태그</h5>
        <ul>
          <li th:each="tag : ${book.bookTags}" th:text="${tag.tagName}">태그명</li>
        </ul>
      </div>
      <p>저자: <span th:text="${book.author}">저자명</span></p>
      <p>출판사: <span th:text="${book.publisher}">출판사명</span></p>
      <p>출판일: <span th:text="${book.publishAt}"></span></p>
      <p>정가: <span th:text="${book.originalPrice}">0</span>원</p>
      <p>판매가: <span th:text="${book.salePrice}">0</span>원</p>
      <p>도서 상태: <span th:text="${book.status}"></span></p>
      <p>재고: <span th:text="${book.stock}">0</span>권</p>
      <p>포장 가능 여부: <span th:text="${book.wrappable} ? '가능' : '불가'"></span></p>

      <p th:if="${book.toc != null and !#strings.isEmpty(book.toc)}">
        목차: <span th:text="${book.toc}"></span>
      </p>
      <p th:if="${book.description}">
        설명: <span th:text="${book.description}"></span>
      </p>

      <p>좋아요 수: <span th:text="${book.likeCount}"></span>개</p>
      <!-- 좋아요 버튼 -->
      <form th:action="@{'/books/' + ${book.id} + '/bookLikes'}" method="post" style="display:inline;">
        <input type="hidden" name="_method" value="post" />
        <button type="submit" class="btn btn-primary">좋아요</button>
      </form>

      <form th:action="@{'/books/' + ${book.id} + '/bookLikes'}" method="post" style="display:inline;"
            onsubmit="return confirm('좋아요를 취소하시겠습니까?');">
        <input type="hidden" name="_method" value="delete" />
        <button type="submit" class="btn btn-secondary">좋아요 취소</button>
      </form>

      <form th:action="@{/books}" method="post" class="mt-3">
        <input type="hidden" name="bookId" th:value="${book.id}" />
        <input type="hidden" name="title" th:value="${book.title}" />
        <input type="hidden" name="salePrice" th:value="${book.salePrice}" />
        <input type="hidden" name="wrappable" th:value="${book.wrappable}" />

        <div class="mb-2">
          <label for="quantity">수량</label>
          <input type="number" id="quantity" name="quantity" value="1" min="1" max="100" class="form-control" style="width:120px;" required />
        </div>

        <button type="submit" class="btn btn-success">구매하기</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
