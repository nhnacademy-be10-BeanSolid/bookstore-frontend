<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title layout:fragment="title" th:text="${book.title} + ' 상세정보'">도서 상세</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div layout:fragment="content" class="container mt-4" style="max-width:900px;">
  <div class="card shadow-sm p-4">
    <div class="row">
      <!-- 왼쪽: 이미지 -->
      <div class="col-md-4 text-center">
        <img th:src="${book.image}" alt="Book Image"
             style="width: 100%; max-height: 600px; object-fit: contain; background-color: #f5f5f5;" />
      </div>

      <!-- 오른쪽: 도서 기본 정보 -->
      <div class="col-md-8">
        <h3 th:text="${book.title}" class="mb-3">도서 제목</h3>
        <p><strong>저자:</strong> <span th:text="${book.author}">저자</span></p>
        <p><strong>출판사:</strong> <span th:text="${book.publisher}">출판사</span></p>
        <p><strong>출판일:</strong> <span th:text="${book.publishAt}">날짜</span></p>
        <p><strong>정가:</strong> <span th:text="${book.originalPrice}">0</span>원</p>
        <p><strong>판매가:</strong> <span th:text="${book.salePrice}">0</span>원</p>
        <p><strong>도서 상태:</strong> <span th:text="${book.status}">상태</span></p>
        <p><strong>재고:</strong> <span th:text="${book.stock}">0</span>권</p>
        <p><strong>포장 가능 여부:</strong> <span th:text="${book.wrappable} ? '가능' : '불가'"></span></p>
        <p><strong>좋아요 수:</strong> <span th:text="${book.likeCount}">0</span>개</p>

        <!-- 카테고리 -->
        <div>
          <strong>카테고리:</strong>
          <ul class="list-inline">
            <li class="list-inline-item badge bg-info" th:each="cat : ${book.bookCategories}" th:text="${cat.categoryName}">카테고리</li>
          </ul>
        </div>

        <!-- 태그 -->
        <div>
          <strong>태그:</strong>
          <ul class="list-inline">
            <li class="list-inline-item badge bg-secondary" th:each="tag : ${book.bookTags}" th:text="${tag.tagName}">태그</li>
          </ul>
        </div>
      </div>
    </div>

    <!-- 하단: 설명, 좋아요, 구매 등 -->
    <hr class="my-4" />

    <div th:if="${book.toc != null and !#strings.isEmpty(book.toc.trim())}" class="mb-2">
      <strong>목차:</strong> <span th:text="${book.toc}"></span>
    </div>
    <div th:if="${book.description}" class="mb-2">
      <strong>설명:</strong> <span th:text="${book.description}"></span>
    </div>

    <!-- 좋아요 -->
    <div class="mb-3">
      <form th:action="@{'/books/' + ${book.id} + '/bookLikes'}" method="post" class="d-inline">
        <input type="hidden" name="_method" value="post" />
        <button type="submit" class="btn btn-outline-danger btn-sm">좋아요</button>
      </form>
      <form th:action="@{'/books/' + ${book.id} + '/bookLikes'}" method="post" class="d-inline"
            onsubmit="return confirm('좋아요를 취소하시겠습니까?');">
        <input type="hidden" name="_method" value="delete" />
        <button type="submit" class="btn btn-outline-secondary btn-sm">좋아요 취소</button>
      </form>
    </div>

    <!-- 수량 + 버튼 -->
    <div class="row align-items-end">
      <div class="col-md-2">
        <label for="quantity" class="form-label">수량</label>
        <input type="number" id="quantity" value="1" min="1" max="100" class="form-control" required />
      </div>
      <div class="col-md-10">
        <form id="buyNowForm" th:action="@{/orders}" method="post" class="d-inline" onsubmit="updateQuantities()">
          <input type="hidden" name="createItemRequests[0].bookId" th:value="${book.id}" />
          <input type="hidden" name="createItemRequests[0].quantity" id="buyNowQuantity" value="1" />
          <button type="submit" class="btn btn-success me-2">구매하기</button>
        </form>

        <form id="addToCartForm" th:action="@{/cart/add}" method="post" class="d-inline" onsubmit="updateQuantities()">
          <input type="hidden" name="bookId" th:value="${book.id}" />
          <input type="hidden" name="quantity" id="addToCartQuantity" value="1" />
          <button type="submit" class="btn btn-primary">장바구니 추가</button>
        </form>
      </div>
      <a th:href="@{/reviews/form(bookId=${book.id})}" class="btn btn-secondary mt-3">리뷰 작성</a>
    </div>
    <!-- 리뷰 컨테이너 -->
    <div id="review-container">
      <p>리뷰를 불러오는 중입니다...</p>
    </div>
    <script th:inline="javascript">
      document.addEventListener("DOMContentLoaded", function () {
        const bookId = /*[[${book.id}]]*/ 0;

        fetch(`/reviews/book/${bookId}/list-fragment`)
                .then(response => response.text())
                .then(html => {
                  document.getElementById("review-container").innerHTML = html;
                })
                .catch(error => {
                  document.getElementById("review-container").innerHTML = "<p>리뷰를 불러오는 데 실패했습니다.</p>";
                  console.error("리뷰 로딩 오류:", error);
                });
      });
    </script>

    <!-- 도서 관련 쿠폰 발급 -->
    <div class="mt-4">
        <h5>이 도서에 적용 가능한 쿠폰</h5>
        <div th:if="${bookCoupons.isEmpty()}">
            <p>현재 이 도서에 적용 가능한 쿠폰이 없습니다.</p>
        </div>
        <div th:each="coupon : ${bookCoupons}" class="card mb-2">
            <div class="card-body">
                <h6 class="card-title" th:text="${coupon.couponName}">쿠폰 이름</h6>
                <p class="card-text">
                    <span th:text="${coupon.couponDiscountType == T(com.nhnacademy.frontend.coupon.domain.CouponDiscountType).AMOUNT ? coupon.couponDiscountAmount + '원 할인' : coupon.couponDiscountAmount + '% 할인'}"></span>
                    <span th:if="${coupon.couponMaximumDiscountAmount != null}"> (최대 <span th:text="${coupon.couponMaximumDiscountAmount}"></span>원 할인)</span>
                    <span th:if="${coupon.couponMinimumOrderAmount != null}"> (<span th:text="${coupon.couponMinimumOrderAmount}"></span>원 이상 구매 시)</span>
                </p>
                <form th:action="@{/books/issue-coupon}" method="post">
                    <input type="hidden" name="couponPolicyId" th:value="${coupon.couponId}" />
                    <input type="hidden" name="bookId" th:value="${book.id}" />
                    <button type="submit" class="btn btn-sm btn-info">쿠폰 발급받기</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 수량 반영 스크립트 -->
    <script th:inline="javascript">
      function updateQuantities() {
        const quantity = document.getElementById('quantity').value;
        document.getElementById('buyNowQuantity').value = quantity;
        document.getElementById('addToCartQuantity').value = quantity;
      }
      document.getElementById('quantity').addEventListener('change', updateQuantities);
    </script>
  </div>
</div>

<!-- Bootstrap JS (optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
