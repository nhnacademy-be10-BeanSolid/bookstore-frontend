<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${book.title} + ' - 카테고리 관리'">카테고리 관리</title>
</head>
<body>
    <h1 th:text="${book.title} + ' - 카테고리 관리'">카테고리 관리</h1>

    <h2>현재 카테고리 목록</h2>
    <ul>
        <li th:each="category : ${book.bookCategories}">
            <span th:text="${category.categoryName}"></span>
            <form th:action="@{/books/{id}/categories/{categoryId}(id=${book.id}, categoryId=${category.categoryId})}" method="post">
                <input type="hidden" name="_method" value="delete" />
                <button type="submit">삭제</button>
            </form>
        </li>
    </ul>

    <h3>카테고리 추가</h3>
    <form th:action="@{/books/{id}/categories(id=${book.id})}" method="post">
        <input type="text" name="categoryId" placeholder="카테고리 아이디 입력" required />
        <button type="submit">추가</button>
    </form>
    <a href="/books">책 목록으로</a>
</body>
</html>
