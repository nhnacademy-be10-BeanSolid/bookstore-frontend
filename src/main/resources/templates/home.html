<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title layout:fragment="title">메인 페이지</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container" style="max-width:1200px;">
        <!-- ✅ 정렬 드롭다운 -->
        <div class="d-flex justify-content-end mb-3 mt-4">
            <form method="get" th:action="@{${basePath}}" id="sortForm">
                <input type="hidden" name="page" th:value="${page.number}" id="pageInput"/>
                <input type="hidden" name="size" th:value="${page.size}" />
                <select id="sortSelect" name="sort" class="form-select w-auto" onchange="this.form.submit()">
                    <option value="publishAt,desc">최신순</option>
                    <option value="salePrice,asc">최저가</option>
                    <option value="salePrice,desc">최고가</option>
                    <option value="viewCount,desc">조회수 높은순</option>
                    <option value="reviewCount,desc">리뷰수 높은순</option>
                    <option value="rating,desc">평점 높은순</option>
                </select>
            </form>
        </div>
        <div class="row mt-4">
            <!-- 좌측 카테고리 -->
            <div class="col-2">
                <div th:replace="~{fragments/category-tree :: categoryList(${categoryTree})}"></div>
            </div>
            <div class="col-10">
                <!-- 책 2열 -->
                <div class="row row-cols-2 g-4">
                    <div class="col" th:each="book : ${books}">
                        <div class="card h-100">
                            <div class="row g-0 h-100">
                                <div class="col-md-5 d-flex align-items-center justify-content-center p-2">
                                    <a th:href="@{/books/{id}(id=${book.id})}" class="w-100 text-center">
                                        <img th:src="${book.image}" class="img-fluid" alt="Book Image" style="max-height: 220px; object-fit: contain;">
                                    </a>
                                </div>
                                <div class="col-md-7 d-flex flex-column">
                                    <div class="card-body">
                                        <h5 class="card-title" th:text="${book.title}">도서 제목</h5>
                                        <p class="card-text">
                                            저자: <span th:text="${book.author}">저자</span><br>
                                            가격: <span th:text="${book.salePrice}">0</span>원<br>
                                            재고: <span th:text="${book.stock}">0</span>권<br>
                                            조회수: <span th:text="${book.viewCount}"></span><br>
                                            평점: <span th:text="${book.rating}"></span>
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- 페이지네이션 -->
        <div class="d-flex justify-content-center align-items-center mt-4 mb-4">
            <nav th:if="${page.totalPages > 0}">
                <ul class="pagination mb-0"
                    th:with="
        currentPage=${page.number},
        totalPages=${page.totalPages},
        displayCount=10,
        startPage=${currentPage},
        endPage=${(currentPage + displayCount - 1) < (totalPages - 1) ? (currentPage + displayCount - 1) : (totalPages - 1)},
        sortExists=${param.sort != null and !#strings.isEmpty(param.sort)}">

                    <!-- 이전 버튼 -->
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:if="${sortExists}"
                           th:href="@{${basePath}(page=${currentPage - 1}, size=${page.size}, sort=${param.sort})}"
                           aria-label="Previous">&larr;</a>
                        <a class="page-link" th:unless="${sortExists}"
                           th:href="@{${basePath}(page=${currentPage - 1}, size=${page.size})}"
                           aria-label="Previous">&larr;</a>
                    </li>

                    <!-- 페이지 번호 -->
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(startPage, endPage)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:if="${sortExists}"
                           th:href="@{${basePath}(page=${i}, size=${page.size}, sort=${param.sort})}"
                           th:text="${i + 1}">1</a>
                        <a class="page-link" th:unless="${sortExists}"
                           th:href="@{${basePath}(page=${i}, size=${page.size})}"
                           th:text="${i + 1}">1</a>
                    </li>

                    <!-- 다음 버튼 -->
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:if="${sortExists}"
                           th:href="@{${basePath}(page=${currentPage + 1}, size=${page.size}, sort=${param.sort})}"
                           aria-label="Next">&rarr;</a>
                        <a class="page-link" th:unless="${sortExists}"
                           th:href="@{${basePath}(page=${currentPage + 1}, size=${page.size})}"
                           aria-label="Next">&rarr;</a>
                    </li>
                </ul>

            </nav>
        </div>
    </div>
</div>

<div layout:fragment="scripts">
    <script>
        const sortSelect = document.getElementById('sortSelect');
        const pageInput = document.getElementById('pageInput');

        sortSelect.addEventListener('change', () => {
            pageInput.value = 0;
            document.getElementById('sortForm').submit();
        });
    </script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const currentSort = urlParams.get("sort");

        const select = document.getElementById("sortSelect");

        if (currentSort) {
            select.value = currentSort; // 현재 선택값 설정

            // 선택된 옵션을 맨 위로 올리기
            const options = Array.from(select.options);
            const selectedOptionIndex = options.findIndex(opt => opt.value === currentSort);

            if (selectedOptionIndex > -1) {
                const selectedOption = options.splice(selectedOptionIndex, 1)[0];
                options.unshift(selectedOption);
                select.innerHTML = '';
                options.forEach(opt => select.appendChild(opt));

                // 선택된 값 다시 설정 (innerHTML 날렸으므로)
                select.value = currentSort;
            }
        }
    </script>

    <script th:if="${accessDenied != null}">
        alert('[[${accessDenied}]]');
    </script>
</div>
</body>
</html>
