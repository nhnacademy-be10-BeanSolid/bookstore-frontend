<!-- templates/search.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>검색 결과</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- 🔍 검색 결과 영역 -->
<div layout:fragment="content" class="container mt-5" style="max-width:1200px;">
    <h2 class="mb-4" th:text="'검색 결과: ' + ${keyword}"></h2>

    <div th:if="${books.isEmpty()}">
        <p>검색 결과가 없습니다.</p>
    </div>

<!--    <div class="d-flex justify-content-end mb-3">-->
<!--        <form method="get" th:action="@{/search}" id="sortForm">-->
<!--            <input type="hidden" name="page" th:value="${page.number}" id="pageInput"/>-->
<!--            <input type="hidden" name="size" th:value="${page.size}" />-->
<!--            <select id="sortSelect" name="sort" class="form-select w-auto" onchange="this.form.submit()">-->
<!--                <option value="publishAt,desc">발행일 최신순</option>-->
<!--                <option value="publishAt,asc">발행일 오래된순</option>-->
<!--                <option value="salePrice,asc">최저가</option>-->
<!--                <option value="salePrice,desc">최고가</option>-->
<!--            </select>-->
<!--        </form>-->
<!--    </div>-->

    <div class="row row-cols-2 g-4">
        <div class="col" th:each="book : ${books}">
            <div class="card h-100">
                <a th:href="@{/books/{id}(id=${book.id})}">
                    <img th:src="${book.image}" class="card-img-top" alt="Book Image" style="height:180px; object-fit:cover;">
                </a>
                <div class="card-body">
                    <h5 class="card-title" th:text="${book.title}">도서 제목</h5>
                    <p class="card-text">
                        저자: <span th:text="${book.author}">저자</span><br>
                        가격: <span th:text="${book.salePrice}">0</span>원<br>
                        재고: <span th:text="${book.stock}">0</span>권
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- 📄 페이지네이션 -->
    <nav class="mt-5" th:if="${page.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link" th:href="@{/search(keyword=${keyword}, page=${page.number - 1}, size=${page.size})}">&laquo;</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                th:classappend="${i == page.number} ? 'active'">
                <a class="page-link" th:href="@{/search(keyword=${keyword}, page=${i}, size=${page.size})}"
                   th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link" th:href="@{/search(keyword=${keyword}, page=${page.number + 1}, size=${page.size})}">&raquo;</a>
            </li>
        </ul>
    </nav>
</div>

</body>
</html>

<script>
    const sortSelect = document.getElementById('sortSelect');
    const pageInput = document.getElementById('pageInput');

    sortSelect.addEventListener('change', () => {
        pageInput.value = 0;
        document.getElementById('sortForm').submit();
    });
</script>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const currentSort = urlParams.get("sort");

    const select = document.getElementById("sortSelect");

    if (currentSort) {
        select.value = currentSort; // 현재 선택값 설정

        // 선택된 옵션을 맨 위로 올리기
        const options = Array.from(select.options);
        const selectedOptionIndex = options.findIndex(opt => opt.value === currentSort);

        if (selectedOptionIndex > -1) {
            const selectedOption = options.splice(selectedOptionIndex, 1)[0];
            options.unshift(selectedOption);
            select.innerHTML = '';
            options.forEach(opt => select.appendChild(opt));

            // 선택된 값 다시 설정 (innerHTML 날렸으므로)
            select.value = currentSort;
        }
    }
</script>
