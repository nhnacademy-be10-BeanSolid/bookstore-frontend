<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입 방식 선택</title>
    <meta name="viewport" content="width=600, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white">
<div class="container d-flex flex-column align-items-center" style="max-width: 600px; min-height: 100vh; margin-top: 30px;">
    <!-- 로고 박스 -->
    <a href="/" class="border rounded d-flex justify-content-center align-items-center my-4"
       style="width:200px; height:160px;">
        <img src="/images/BeanSolid-Logo.png" alt="로고" class="img-fluid" style="max-width:180px; max-height:140px;">
    </a>
    <div class="row w-100 justify-content-center">
        <!-- PAYCO 회원가입 -->
        <div class="col-12 col-md-6 d-flex flex-column align-items-center mb-4 mb-md-0">
            <div class="mb-2">페이코를 통한 회원가입</div>
            <a href="/auth/login/payco"
               class="d-flex border rounded text-decoration-none justify-content-center align-items-center bg-danger"
               style="width:220px; height:220px;">
                <span class="text-white fw-bold fs-1">PAYCO</span>
            </a>
        </div>
        <!-- 일반 회원가입 -->
        <div class="col-12 col-md-6 d-flex flex-column align-items-center">
            <div class="mb-2">일반 회원가입</div>
            <a href="/auth/signup/normal-signup"
               class="d-flex border rounded text-decoration-none justify-content-center align-items-center bg-secondary"
               style="width:220px; height:220px;">
                <span class="text-white fs-4">일반 회원가입</span>
            </a>
        </div>
    </div>
</div>
</body>
</html>
