<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>OAuth2 회원가입 추가정보 입력</title>
    <meta name="viewport" content="width=400, initial-scale=1">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white">
<div class="container d-flex flex-column align-items-center" style="max-width: 500px; min-height: 100vh; margin-top: 30px;">
    <!-- 로고 박스 -->
    <a href="/" class="d-flex justify-content-center align-items-center" style="width:140px; height:120px;">
        <img src="/images/BeanSolid-Logo.png" alt="로고" style="max-width:120px; max-height:100px;">
    </a>

    <!-- 회원가입 타이틀 -->
    <div class="w-100 mb-1">
        <span class="fw-bold">OAuth2 회원가입 추가정보 입력</span>
    </div>

    <!-- 구분선 -->
    <hr class="w-100 mb-3 mt-1">

    <!-- 회원정보 입력 타이틀 -->
    <div class="w-100 mb-3">
        <span class="fw-bold">회원정보 입력</span>
    </div>

    <!-- 회원가입 form -->
    <form class="w-100" th:action="@{/auth/signup/oauth2}" method="POST">
        <input type="hidden" name="tempJwt" th:value="${tempJwt}">

        <div class="mb-2">
            <label for="name" class="form-label mb-1">
                이름 <span class="text-danger fw-normal" style="font-size: 0.9em;">(*필수입력)</span>
            </label>
            <input type="text" id="name" name="name" class="form-control bg-secondary text-white border-0" th:value="${name}" required>
        </div>

        <div class="mb-2">
            <label for="email" class="form-label mb-1">
                이메일 <span class="text-danger fw-normal" style="font-size: 0.9em;">(*필수입력)</span>
            </label>
            <input type="email" id="email" name="email" class="form-control bg-secondary text-white border-0" th:value="${email}" required>
        </div>

        <div class="mb-2">
            <label for="mobile" class="form-label mb-1">
                휴대폰 <span class="text-danger fw-normal" style="font-size: 0.9em;">(*필수입력)</span>
            </label>
            <input type="tel" id="mobile" name="mobile" class="form-control bg-secondary text-white border-0" placeholder="010-1234-5678" required>
        </div>

        <div class="mb-4">
            <label for="birth" class="form-label mb-1">
                생년월일 <span class="text-danger fw-normal" style="font-size: 0.9em;">(*필수입력)</span>
            </label>
            <input type="date" id="birth" name="birth" class="form-control bg-secondary text-white border-0" required>
        </div>

        <button type="submit" class="btn btn-secondary w-100 mb-4">회원가입 완료</button>
    </form>
</div>

<script>
    document.getElementById('mobile').addEventListener('input', function (e) {
        const input = e.target;
        let value = input.value.replace(/\D/g, ''); // 숫자만 남김
        let formattedValue = '';

        if (value.length > 0) {
            if (value.length <= 3) {
                formattedValue = value;
            } else if (value.length <= 7) {
                formattedValue = value.substring(0, 3) + '-' + value.substring(3);
            } else {
                formattedValue = value.substring(0, 3) + '-' + value.substring(3, 7) + '-' + value.substring(7, 11);
            }
        }
        input.value = formattedValue;
    });
</script>
</body>
</html>
