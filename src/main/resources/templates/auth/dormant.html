<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>휴면 계정 인증</title>
    <!-- ✅ 부트스트랩 5 CSS 추가 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow">
                <div class="card-header text-center">
                    <h4 class="mb-0">휴면 계정 인증</h4>
                </div>
                <div class="card-body">

                    <!-- ✅ 인증 폼 -->
                    <form action="/auth/login/dormant/verify" method="post">
                        <input type="hidden" name="userId" th:value="${userId}">

                        <div class="mb-3">
                            <label for="code" class="form-label">인증번호를 입력하세요</label>
                            <input type="text" id="code" class="form-control" name="verificationCode" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">인증</button>
                        </div>
                    </form>

                    <div class="mt-3 text-muted">
                        인증번호는 두레이 메시지로 발송되었습니다.
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- ✅ 부트스트랩 JS (선택 사항) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- ✅ 인증번호 실패 메시지 알림 -->
<script th:if="${needVerification != null}">
    alert('[[${needVerification}]]');
</script>

</body>
</html>
