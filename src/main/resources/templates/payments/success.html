<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>결제 완료</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center py-20 px-6">

<div class="bg-white rounded-3xl shadow-2xl p-12 w-full max-w-xl text-center">
  <div class="mb-6">
    <h1 class="text-3xl font-bold text-gray-800 mb-2">결제가 완료되었습니다 🎉</h1>
    <p class="text-gray-600 text-sm">정상적으로 결제가 처리되었습니다. 감사합니다.</p>
  </div>

  <div class="bg-gray-50 border border-gray-200 rounded-xl px-6 py-5 text-left text-sm space-y-3">
    <div class="flex justify-between">
      <span class="font-semibold text-gray-700">💳 결제금액</span>
      <span class="text-gray-800 font-medium" th:text="${amount} + ' 원'">0 원</span>
    </div>
    <div class="flex justify-between">
      <span class="font-semibold text-gray-700">🧾 주문번호</span>
      <span class="text-gray-800 font-mono text-xs" th:text="${orderId}">-</span>
    </div>
    <div class="flex justify-between">
      <span class="font-semibold text-gray-700">🔐 결제키</span>
      <span class="text-gray-800 font-mono text-xs" th:text="${paymentKey}">-</span>
    </div>
  </div>

  <div class="mt-10 flex flex-col sm:flex-row justify-center gap-4">
    <a href="/" class="inline-block bg-primary hover:bg-blue-600 text-white font-semibold py-3 px-8 rounded-xl transition">
      홈으로 가기
    </a>
    <button onclick="window.close()" class="inline-block border border-gray-300 hover:bg-gray-100 text-gray-700 font-medium py-3 px-8 rounded-xl transition">
      창 닫기
    </button>
  </div>

  <footer class="mt-10 text-xs text-gray-400">
    © 2025 Beansolid Bookstore. All rights reserved.
  </footer>
</div>

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: { DEFAULT: '#2563eb', light: '#3b82f6' }
        }
      }
    }
  };
</script>
</body>
</html>
