<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <title>결제 완료</title>
  <style>
    body { font-family: sans-serif; margin: 40px; text-align: center; }
    .section { margin: 20px 0; display: inline-block; text-align: left; }
    .label { font-weight: bold; width: 100px; display: inline-block; }
    button { margin: 8px; padding: 8px 16px; }
  </style>
</head>
<body>
<h2>결제를 완료했어요 🎉</h2>
<div class="section">
  <div><span class="label">결제금액:</span> <span th:text="${amount}">0</span> 원</div>
  <div><span class="label">주문번호:</span> <span th:text="${orderId}">-</span></div>
  <div><span class="label">결제키:</span> <span th:text="${paymentKey}">-</span></div>
</div>
<button onclick="window.close()">닫기</button>
</body>
</html>
