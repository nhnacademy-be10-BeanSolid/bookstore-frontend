<html lang="ko" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/layout}">
<head>
    <title>결제 완료</title>
    <style layout:fragment="css">
        /* 추가적인 CSS가 필요하면 여기에 작성 */
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="container mt-5 d-flex justify-content-center align-items-center" style="min-height: 70vh;">
        <div class="card shadow-lg p-5 text-center" style="max-width: 600px; width: 100%;">
            <div class="mb-4">
                <h1 class="card-title h3 mb-2">결제가 완료되었습니다 🎉</h1>
                <p class="text-muted">정상적으로 결제가 처리되었습니다. 감사합니다.</p>
            </div>

            <div class="card bg-light border-secondary mb-4 text-start">
                <div class="card-body">
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <span class="fw-bold">💳 결제금액</span>
                            <span class="text-dark fw-bold" th:text="${amount} + ' 원'">0 원</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <span class="fw-bold">🧾 주문번호</span>
                            <span class="text-dark font-monospace" th:text="${orderId}">-</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <span class="fw-bold">🔐 결제키</span>
                            <span class="text-dark font-monospace" th:text="${paymentKey}">-</span>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="d-grid gap-2 col-md-8 mx-auto mt-4">
                <a href="/" class="btn btn-primary btn-lg">홈으로 가기</a>
                <button type="button" onclick="window.close()" class="btn btn-outline-secondary btn-lg">
                    창 닫기
                </button>
            </div>

            <footer class="mt-4 text-muted small">
                © 2025 Beansolid Bookstore. All rights reserved.
            </footer>
        </div>
    </div>
</div>
</body>
</html>
