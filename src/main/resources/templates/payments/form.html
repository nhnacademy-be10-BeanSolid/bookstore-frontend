<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8"/>
    <title>결제 요청</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: { DEFAULT: '#2563eb', light: '#3b82f6' } }
                }
            }
        };
    </script>
</head>

<body class="min-h-screen bg-gray-50 py-14 px-6">

<header class="max-w-7xl mx-auto flex justify-end text-sm space-x-4 mb-8">
    <a sec:authorize="isAnonymous()"
       th:href="@{/auth/login}"
       class="text-gray-600 hover:text-primary">로그인</a>
    <a sec:authorize="isAuthenticated()"
       th:href="@{/auth/logout}"
       class="text-gray-600 hover:text-primary">로그아웃</a>
</header>

<main class="w-full max-w-7xl mx-auto bg-white rounded-3xl shadow-2xl p-12 ring-1 ring-gray-100">
    <h1 class="text-3xl font-bold text-gray-800 mb-12">결제 요청</h1>

    <!-- ★ POST /payments 로 전송 -->
    <form th:action="@{/payments}" method="post" th:object="${paymentRequest}"
          class="grid gap-12 lg:grid-cols-[1fr_340px]">

        <!-- 1) 숨겨진 필수 값 (orderId, 성공·실패 URL) -->
        <input type="hidden" th:field="*{orderId}"/>
        <input type="hidden" th:field="*{successUrl}"/>
        <input type="hidden" th:field="*{failUrl}"/>

        <!-- 2) 결제 정보 입력 -->
        <section class="space-y-8">
            <div>
                <label for="payName" class="block mb-2 text-sm font-medium text-gray-700">상품명</label>
                <input id="payName" th:field="*{payName}" required
                       class="w-full h-11 px-4 rounded-lg border-gray-300 shadow-sm
                              focus:border-primary focus:ring-primary/40"/>
            </div>

            <div class="grid sm:grid-cols-2 gap-6">
                <div>
                    <label for="payAmount" class="block mb-2 text-sm font-medium text-gray-700">결제 금액(원)</label>
                    <input id="payAmount" type="number" min="100" th:field="*{payAmount}" required
                           class="w-full h-11 px-4 rounded-lg border-gray-300 shadow-sm
                                  focus:border-primary focus:ring-primary/40"/>
                </div>
                <div>
                    <label for="payType" class="block mb-2 text-sm font-medium text-gray-700">결제 수단</label>
                    <select id="payType" th:field="*{payType}"
                            class="w-full h-11 px-3 rounded-lg border-gray-300 shadow-sm
                                   focus:border-primary focus:ring-primary/40">
                        <option value="CARD">신용카드</option>
                        <option value="ACCOUNT">가상계좌</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- 3) 요약 카드 -->
        <section class="relative">
            <div class="sticky top-6">
                <div class="w-full max-w-xs mx-auto lg:mx-0 bg-gray-50 border border-gray-200
                            rounded-2xl p-7 space-y-4 shadow-sm text-sm">
                    <dl class="space-y-2">
                        <div class="flex justify-between">
                            <dt class="text-gray-600">상품 금액</dt>
                            <dd><span id="sumProduct" th:text="${paymentRequest.payAmount}">0</span>원</dd>
                        </div>
                        <div class="flex justify-between">
                            <dt class="text-gray-600">배송비</dt>
                            <dd><span id="sumShip" th:text="${#numbers.formatInteger(shippingFee ?: 0, 0, 'COMMA')}">0</span>원</dd>
                        </div>
                        <div class="flex justify-between">
                            <dt class="text-gray-600">상품 할인</dt>
                            <dd class="text-primary">- <span id="sumProdDc" th:text="${productDiscount ?: 0}">0</span>원</dd>
                        </div>
                        <div class="flex justify-between">
                            <dt class="text-gray-600">쿠폰 할인</dt>
                            <dd><span id="sumCoupon" th:text="${couponDiscount ?: 0}">0</span>원</dd>
                        </div>
                        <div class="flex justify-between">
                            <dt class="text-gray-600">포인트 사용</dt>
                            <dd><span id="sumPoints">0</span>원</dd>
                        </div>
                    </dl>
                    <hr>
                    <p class="flex justify-between items-center font-semibold text-lg">
                        <span>최종 결제 금액</span>
                        <span id="finalAmt" class="text-primary"
                              th:text="${finalAmount != null ? finalAmount + '원' : '0원'}">0원</span>
                    </p>
                    <p class="flex justify-between text-xs text-gray-500">
                        <span>적립 예정 포인트</span>
                        <span id="expPoint" class="font-medium text-gray-700"
                              th:text="${expectedPoints != null ? expectedPoints + 'P' : '0P'}">0P</span>
                    </p>
                </div>
            </div>
        </section>

        <!-- 4) 추가 할인 / 포인트 (입력 생략 가능) -->
        <section class="lg:col-span-2 pt-8 space-y-4">
            <!-- ... 여기에 쿠폰/포인트 UI 그대로 유지 ... -->
        </section>

        <!-- 5) 결제 요청 버튼 -->
        <div class="lg:col-span-2 text-center pt-12">
            <button type="submit"
                    class="w-full lg:w-auto inline-flex justify-center rounded-xl bg-primary
                          px-16 py-5 font-semibold text-white shadow-lg hover:bg-primary-light
                          focus:ring-4 focus:ring-primary/30 transition">
                결제하기
            </button>
        </div>
    </form>
</main>

<footer class="mt-16 text-center text-sm text-gray-400">© 2025 Beansolid Bookstore</footer>

<script>
    // 요약 카드 JS (생략 가능)
    const toKR   = n => (+n||0).toLocaleString();
    const num    = id => +document.getElementById(id).textContent.replace(/,/g,'');
    const sumBy  = name => [...document.getElementsByName(name)].reduce((t,e)=>t+(+e.value||0), 0);
    const priceEl= document.getElementById('payAmount');

    function clampAndUpdate(el){
        const max=+el.getAttribute('max')||0, v=+el.value||0;
        el.value = v<0?0:(v>max? max: v);
        updateSummary();
    }
    const resetPrev = btn=>{ btn.previousElementSibling.value=0; updateSummary(); };
    const maxPrev   = btn=>{ const ip=btn.previousElementSibling; ip.value=ip.getAttribute('max')||0; updateSummary(); };

    function updateSummary(){
        document.getElementById('sumProduct').textContent = toKR(priceEl.value);
        const shippingFee = num('sumShip');
        const final = (+priceEl.value||0)
            + shippingFee
            - num('sumProdDc')
            - num('sumCoupon')
            - sumBy('pointUse')
            - sumBy('depositUse')
            - sumBy('giftCashUse');
        document.getElementById('sumPoints').textContent = toKR(sumBy('pointUse'));
        document.getElementById('finalAmt').textContent  = toKR(final)+'원';
        document.getElementById('expPoint').textContent  = toKR(Math.floor(final*0.05))+'P';
    }
    priceEl.addEventListener('input', updateSummary);
    updateSummary();
</script>
</body>
</html>
