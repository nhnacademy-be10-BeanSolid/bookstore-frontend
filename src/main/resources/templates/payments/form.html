<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      layout:decorate="~{layout/layout}">
<head>
    <title>결제 요청</title>
    <style layout:fragment="css">
        /* 추가적인 CSS가 필요하면 여기에 작성 */
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="container mt-5">
        <div class="d-flex justify-content-end mb-4">
            <a sec:authorize="isAnonymous()"
               th:href="@{/auth/login}"
               class="text-decoration-none me-3">로그인</a>
            <a sec:authorize="isAuthenticated()"
               th:href="@{/auth/logout}"
               class="text-decoration-none">로그아웃</a>
        </div>

        <div class="card shadow-lg p-4">
            <h1 class="card-title h3 mb-4">결제 요청</h1>

            <form th:action="@{/payments}" method="post" th:object="${paymentRequest}"
                  class="row g-4">

                <!-- 1) 숨겨진 필수 값 (orderId, 성공·실패 URL) -->
                <input type="hidden" th:field="*{orderId}"/>
                <input type="hidden" th:field="*{successUrl}"/>
                <input type="hidden" th:field="*{failUrl}"/>
                <input type="hidden" id="finalPayAmount" th:field="*{payAmount}"/>

                <!-- 2) 결제 정보 입력 -->
                <section class="col-lg-8">
                    <div class="mb-3">
                        <label for="payName" class="form-label">상품명</label>
                        <input id="payName" th:field="*{payName}" required
                               class="form-control"/>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="displayAmount" class="form-label">결제 금액(원)</label>
                            <input id="displayAmount" type="number" min="100" required readonly
                                   th:value="${paymentRequest.payAmount}"
                                   class="form-control bg-light"/>
                        </div>
                        <div class="col-md-6">
                            <label for="payType" class="form-label">결제 수단</label>
                            <select id="payType" th:field="*{payType}"
                                    class="form-select">
                                <option value="CARD">신용카드</option>
                                <option value="ACCOUNT">가상계좌</option>
                            </select>
                        </div>
                    </div>
                </section>

                <!-- 3) 요약 카드 -->
                <section class="col-lg-4">
                    <div class="card bg-light border-secondary shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title mb-3">결제 요약</h5>
                            <dl class="row mb-2">
                                <dt class="col-6 text-muted">상품 금액</dt>
                                <dd class="col-6 text-end"><span id="sumProduct" th:text="${paymentRequest.payAmount}">0</span>원</dd>

                                <dt class="col-6 text-muted">배송비</dt>
                                <dd class="col-6 text-end"><span id="sumShip" th:text="${#numbers.formatInteger(shippingFee ?: 0, 0, 'COMMA')}">0</span>원</dd>

                                <dt class="col-6 text-muted">상품 할인</dt>
                                <dd class="col-6 text-end text-primary">- <span id="sumProdDc" th:text="${productDiscount ?: 0}">0</span>원</dd>

                                <dt class="col-6 text-muted">쿠폰 할인</dt>
                                <dd class="col-6 text-end"><span id="sumCoupon" th:text="${couponDiscount ?: 0}">0</span>원</dd>

                                <dt class="col-6 text-muted">포인트 사용</dt>
                                <dd class="col-6 text-end"><span id="sumPoints">0</span>원</dd>
                            </dl>
                            <hr>
                            <p class="d-flex justify-content-between align-items-center fw-bold fs-5 mt-3">
                                <span>최종 결제 금액</span>
                                <span id="finalAmt" class="text-primary"
                                      th:text="${finalAmount != null ? finalAmount + '원' : '0원'}">0원</span>
                            </p>
                            <p class="d-flex justify-content-between text-muted small">
                                <span>적립 예정 포인트</span>
                                <span id="expPoint" class="fw-bold"
                                      th:text="${expectedPoints != null ? expectedPoints + 'P' : '0P'}">0P</span>
                            </p>
                        </div>
                    </div>
                </section>

                <!-- 4) 추가 할인 / 포인트 (입력 생략 가능) -->
                <section class="col-12 pt-4">
                    <div class="mb-4">
                        <h2 class="h5 mb-3">포인트 사용</h2>
                        <div class="d-flex align-items-center">
                            <p class="text-muted mb-0 me-3">현재 보유 포인트: <span id="currentPoints" th:text="${#numbers.formatInteger(currentPoints ?: 0, 0, 'COMMA')}">0</span>P</p>
                            <input type="number" id="pointUseInput" name="usedPoint" min="0" th:max="${currentPoints}" value="0"
                                   class="form-control w-auto me-2"
                                   oninput="clampAndUpdate(this)"/>
                            <button type="button" onclick="maxPrev(this)"
                                    class="btn btn-outline-secondary">
                                모두 사용
                            </button>
                        </div>
                    </div>
                </section>

                <!-- 5) 결제 요청 버튼 -->
                <div class="col-12 text-center pt-5">
                    <button type="submit"
                            class="btn btn-primary btn-lg px-5 py-3">
                        결제하기
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script layout:fragment="script">
        // 요약 카드 JS (생략 가능)
        const toKR   = n => (+n||0).toLocaleString();
        const num    = id => +document.getElementById(id).textContent.replace(/,/g,'');
        const sumBy  = name => [...document.getElementsByName(name)].reduce((t,e)=>t+(+e.value||0), 0);
        const priceEl= document.getElementById('displayAmount');
        const finalPayAmountEl = document.getElementById('finalPayAmount');
        const originalAmount = +priceEl.value || 0; // 원래 상품 금액 저장

        function clampAndUpdate(el){
            const max=+el.getAttribute('max')||0, v=+el.value||0;
            el.value = v<0?0:(v>max? max: v);
            updateSummary();
        }
        const resetPrev = btn=>{ btn.previousElementSibling.value=0; updateSummary(); };
        const maxPrev   = btn=>{ const ip=btn.previousElementSibling; ip.value=ip.getAttribute('max')||0; updateSummary(); };

        function updateSummary(){
            // 상품 금액은 원래 값으로 고정
            document.getElementById('sumProduct').textContent = toKR(originalAmount);
            const shippingFee = num('sumShip');
            const beforePointDeduction = originalAmount
                + shippingFee
                - num('sumProdDc')
                - num('sumCoupon')
                - sumBy('depositUse')
                - sumBy('giftCashUse');
            
            // 포인트 사용량이 결제 가능 금액을 초과하지 않도록 제한
            const maxUsablePoints = Math.max(0, beforePointDeduction);
            const currentUsedPoints = sumBy('usedPoint');
            
            if (currentUsedPoints > maxUsablePoints) {
                // 포인트 사용량을 최대 사용 가능한 금액으로 제한
                const pointInputs = document.getElementsByName('usedPoint');
                for (let input of pointInputs) {
                    if (input.value > maxUsablePoints) {
                        input.value = maxUsablePoints;
                    }
                }
            }
            
            const final = Math.max(0, beforePointDeduction - sumBy('usedPoint'));
            
            document.getElementById('sumPoints').textContent = toKR(sumBy('usedPoint'));
            document.getElementById('finalAmt').textContent  = toKR(final)+'원';
            document.getElementById('expPoint').textContent  = toKR(Math.floor(final*0.05))+'P';
            
            // finalAmt에서 실제 표시된 금액을 추출하여 제출
            const finalAmtText = document.getElementById('finalAmt').textContent;
            const finalAmtValue = parseInt(finalAmtText.replace(/[^0-9]/g, '')) || 0;
            
            // 최종 결제 금액을 hidden 필드와 display 필드에 설정
            finalPayAmountEl.value = finalAmtValue;
            priceEl.value = finalAmtValue;
        }
        priceEl.addEventListener('input', updateSummary);
        updateSummary();
    </script>
</div>
</body>
</html>
