<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title layout:fragment="title">Beansolid - 비회원 주문 상세 조회</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container mt-4" style="max-width: 1200px;">
        <div class="row">
            <div class="col-12">
                <h3 class="mb-4">비회원 주문 상세 정보</h3>
    
                <div th:object="${order}">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="card mb-4">
                                <div class="card-header">
                                    <h5 class="card-title mb-0">기본 정보</h5>
                                </div>
                                <div class="card-body">
                                    <table class="table table-bordered">
                                        <tbody>
                                            <tr>
                                                <th class="bg-light" style="width: 40%;">주문 번호</th>
                                                <td th:text="*{orderId}"></td>
                                            </tr>
                                            <tr>
                                                <th class="bg-light">주문 날짜</th>
                                                <td th:text="*{orderDate}"></td>
                                            </tr>
                                            <tr>
                                                <th class="bg-light">주문 상태</th>
                                                <td>
                                                    <span class="badge bg-primary" th:text="*{status}"></span>
                                                </td>
                                            </tr>
                                            <tr>
                                                <th class="bg-light">주문 금액</th>
                                                <td class="text-end fw-bold" th:text="*{totalAmount} + '원'"></td>
                                            </tr>
                                            <tr>
                                                <th class="bg-light">배송비</th>
                                                <td class="text-end" th:text="*{deliveryFee} + '원'"></td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
        
                        <div class="col-md-6">
                            <div class="card mb-4">
                                <div class="card-header">
                                    <h5 class="card-title mb-0">배송 정보</h5>
                                </div>
                                <div class="card-body">
                                    <table class="table table-bordered">
                                        <tbody>
                                            <tr>
                                                <th class="bg-light" style="width: 40%;">수령인</th>
                                                <td th:text="*{receiverName}"></td>
                                            </tr>
                                            <tr>
                                                <th class="bg-light">연락처</th>
                                                <td th:text="*{receiverPhoneNumber}"></td>
                                            </tr>
                                            <tr>
                                                <th class="bg-light">배송 주소</th>
                                                <td th:text="*{address}"></td>
                                            </tr>
                                            <tr>
                                                <th class="bg-light">희망 배송일</th>
                                                <td th:text="*{requestedDeliveryDate}"></td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
        
                    <div class="row">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-header">
                                    <h5 class="card-title mb-0">주문 상품 정보</h5>
                                </div>
                                <div class="card-body">
                                    <div class="table-responsive">
                                        <table class="table table-striped table-bordered">
                                            <thead class="table-dark">
                                                <tr>
                                                    <th>도서명</th>
                                                    <th class="text-center">수량</th>
                                                    <th class="text-end">도서 가격</th>
                                                    <th class="text-center">포장지</th>
                                                    <th class="text-end">포장 가격</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr th:each="item : *{itemInfos}">
                                                    <td th:text="${item.title}"></td>
                                                    <td class="text-center" th:text="${item.quantity}"></td>
                                                    <td class="text-end" th:text="${item.bookPrice} + '원'"></td>
                                                    <td class="text-center" th:text="${item.wrappingName != null ? item.wrappingName : '-'}"></td>
                                                    <td class="text-end" th:text="${item.wrappingPrice != null ? item.wrappingPrice + '원' : '-'}"></td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
    
                <div class="row mt-4">
                    <div class="col-12 text-center">
                        <a href="/auth/login" class="btn btn-secondary">로그인 페이지로 돌아가기</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
