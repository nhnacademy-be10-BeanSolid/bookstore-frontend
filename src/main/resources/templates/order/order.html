<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title layout:fragment="title">Beansolid - 배송정보 입력</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container mt-4" style="max-width: 1200px;">
        <div class="row">
            <div class="col-12">
                <h3 class="mb-4">주문 상품</h3>
                <div class="table-responsive">
                    <table class="table table-striped table-bordered">
                        <thead class="table-dark">
                            <tr>
                                <th>도서명</th>
                                <th>수량</th>
                                <th>가격</th>
                                <th>포장 옵션</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${items}">
                                <td th:text="${item.title}"></td>
                                <td th:text="${item.quantity}"></td>
                                <td th:text="${item.price} + '원'"></td>
                                <td th:if="${item.wrappable}">
                                    <select class="form-select" th:name="|wrapping_${itemStat.index}|" th:onchange="|updateWrappingId(${itemStat.index}, this.value)|">
                                        <option value="" selected>포장 안함</option>
                                        <option value="1">일반 포장</option>
                                        <option value="2">선물 포장</option>
                                        <option value="3">고급 포장</option>
                                    </select>
                                </td>
                                <td th:unless="${item.wrappable}">포장 불가</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div class="row mt-5">
            <div class="col-12">
                <h3 class="mb-4">배송 정보</h3>
                <form th:action="@{/orders}" method="post">
                    <th:block th:each="item : ${items}">
                        <input type="hidden" th:name="|orderItems[${itemStat.index}].bookId|" th:value="${item.bookId}">
                        <input type="hidden" th:name="|orderItems[${itemStat.index}].quantity|" th:value="${item.quantity}">
                        <input type="hidden" th:name="|orderItems[${itemStat.index}].price|" th:value="${item.price}">
                        <input type="hidden" th:name="|orderItems[${itemStat.index}].wrappingId|" value="">
                    </th:block>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="receiverName" class="form-label">받는 분</label>
                                <input type="text" class="form-control" id="receiverName" name="receiverName" placeholder="이름을 입력하세요" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="receiverPhoneNumber" class="form-label">휴대폰번호</label>
                                <input type="text" class="form-control" id="receiverPhoneNumber" name="receiverPhoneNumber" placeholder="연락처를 입력하세요" required>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="deliveryAddress" class="form-label">배송지</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="deliveryAddress" name="deliveryAddress" placeholder="배송지를 선택하세요" readonly required>
                                    <button class="btn btn-outline-secondary" type="button" onclick="searchAddress()">변경</button>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="requestedDeliveryDate" class="form-label">배송 희망일</label>
                                <input type="date" class="form-control" id="requestedDeliveryDate" name="requestedDeliveryDate">
                            </div>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">다음 단계</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="scripts">
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script>
        function searchAddress() {
            new daum.Postcode({
                oncomplete: function(data) {
                    document.getElementById('deliveryAddress').value = data.address;
                }
            }).open();
        }

        function updateWrappingId(index, wrappingId) {
            const hiddenInput = document.querySelector(`input[name="orderItems[${index}].wrappingId"]`);
            if (hiddenInput) {
                hiddenInput.value = wrappingId;
            }
        }
    </script>
</div>
</body>
</html>
