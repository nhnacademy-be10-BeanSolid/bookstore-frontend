<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주소 선택</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="h2 fw-bold">주소 선택</h1>
        <hr>
    </div>

    <table class="table table-hover text-center">
        <thead class="table-light">
        <tr>
            <th style="width: 20%;">별칭</th>
            <th>상세 주소</th>
            <th style="width: 15%;">선택</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="address : ${addresses}">
            <td th:text="${address.addressNickName}">별칭</td>
            <td class="text-start" th:text="${address.addressDetail}">상세 주소</td>
            <td>
                <button type="button" class="btn btn-sm btn-primary" th:attr="onclick=|selectAddress('${address.addressDetail}')|">선택</button>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="d-flex justify-content-end mt-4">
        <button type="button" class="btn btn-secondary" onclick="window.close();">닫기</button>
    </div>
</div>

<!-- Bootstrap JS (Popper 포함) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function selectAddress(selectedAddress) {
        // 부모 창(order.html)의 배송지 필드에 선택된 주소 설정
        if (window.opener && !window.opener.closed) {
            try {
                window.opener.document.getElementById('deliveryAddress').value = selectedAddress;
                window.close();
            } catch (e) {
                alert('주소를 적용하는 데 실패했습니다. 부모 창이 올바른지 확인해주세요.');
                console.error(e);
            }
        } else {
            alert('주소를 적용할 부모 창을 찾을 수 없습니다.');
        }
    }
</script>
<script th:if="${errorMessage}" th:inline="javascript">
    alert('[[${errorMessage}]]');
</script>
</body>
</html>
