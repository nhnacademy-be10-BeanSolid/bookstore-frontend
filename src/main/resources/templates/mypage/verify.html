<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title layout:fragment="title">본인 인증</title>
</head>

<div layout:fragment="content" class="container py-5 flex-grow-1">
    <div class="text-center mb-5">
        <h1 class="h2 fw-bold">본인 인증</h1>
        <hr>
    </div>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <form th:action="@{/mypage/verify}" method="post">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                <div class="mb-3">
                    <label for="password" class="form-label">비밀번호를 입력하세요</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">확인</button>
            </form>
        </div>
    </div>
    <div class="d-flex justify-content-end mt-4">
        <a href="/mypage" class="btn btn-secondary me-2">마이페이지로 돌아가기</a>
    </div>
</div>
<div layout:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</html>
