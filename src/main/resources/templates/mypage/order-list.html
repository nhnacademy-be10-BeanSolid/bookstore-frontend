<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title layout:fragment="title">Beansolid - 주문 목록</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container mt-4" style="max-width: 1200px;">
        <div class="row">
            <div class="col-12">
                <h3 class="mb-4">주문 목록</h3>
    
                <div th:if="${orders.content.size() > 0}">
                    <div class="table-responsive">
                        <table class="table table-striped table-bordered">
                            <thead class="table-dark">
                                <tr>
                                    <th>주문 번호</th>
                                    <th>주문 날짜</th>
                                    <th>수령인</th>
                                    <th>주문 금액</th>
                                    <th>상태</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="order : ${orders.content}">
                                    <td><a th:href="@{/mypage/orders/{orderNumber}(orderNumber=${order.orderNumber})}" th:text="${order.orderNumber}" class="text-decoration-none"></a></td>
                                    <td th:text="${order.orderDate}"></td>
                                    <td th:text="${order.receiverName}"></td>
                                    <td th:text="${#numbers.formatInteger(order.totalPrice, 3, 'COMMA')} + '원'" class="text-end"></td>
                                    <td>
                                        <span class="badge bg-primary" th:text="${order.status}"></span>
                                    </td>
                                    <td>
                                        <!-- 결제 대기 상태일 때 결제취소 버튼 -->
                                        <form th:if="${order.status == 'PENDING_PAY'}" th:action="@{/mypage/orders/{orderNumber}/cancel(orderNumber=${order.orderNumber})}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('정말로 결제를 취소하시겠습니까?')">결제취소</button>
                                        </form>
                                        <!-- 완료 상태일 때 반품신청 버튼 -->
                                        <form th:if="${order.status == 'COMPLETED'}" th:action="@{/mypage/orders/{orderNumber}/return(orderNumber=${order.orderNumber})}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-warning btn-sm" onclick="return confirm('반품을 신청하시겠습니까?')">반품신청</button>
                                        </form>
                                        <!-- 다른 상태일 때는 버튼 없음 -->
                                        <span th:if="${order.status != 'PENDING_PAY' && order.status != 'COMPLETED'}" class="text-muted">-</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
    
                <div th:if="${orders.content.size() == 0}" class="alert alert-info text-center">
                    <p class="mb-0">주문 내역이 없습니다.</p>
                </div>
    
                <!-- 페이지네이션 -->
                <div th:if="${orders.totalPages > 1}" class="d-flex justify-content-center mt-4">
                    <nav aria-label="Page navigation">
                        <ul class="pagination">
                            <li class="page-item" th:classappend="${!orders.hasPrevious()} ? 'disabled' : ''">
                                <a class="page-link" th:if="${orders.hasPrevious()}" 
                                   th:href="@{/mypage/orders(page=${orders.number - 1}, size=${orders.size})}">이전</a>
                                <span class="page-link" th:unless="${orders.hasPrevious()}">이전</span>
                            </li>
                            
                            <li th:each="i : ${#numbers.sequence(0, orders.totalPages - 1)}" 
                                class="page-item" th:classappend="${i == orders.number} ? 'active' : ''">
                                <a th:if="${i != orders.number}" class="page-link" 
                                   th:href="@{/mypage/orders(page=${i}, size=${orders.size})}"
                                   th:text="${i + 1}"></a>
                                <span th:if="${i == orders.number}" class="page-link" 
                                      th:text="${i + 1}"></span>
                            </li>
                            
                            <li class="page-item" th:classappend="${!orders.hasNext()} ? 'disabled' : ''">
                                <a class="page-link" th:if="${orders.hasNext()}" 
                                   th:href="@{/mypage/orders(page=${orders.number + 1}, size=${orders.size})}">다음</a>
                                <span class="page-link" th:unless="${orders.hasNext()}">다음</span>
                            </li>
                        </ul>
                    </nav>
                </div>
                
                <!-- 페이지 정보 -->
                <div th:if="${orders.totalPages > 0}" class="text-center mt-2 text-muted">
                    <small th:text="|페이지 ${orders.number + 1} / ${orders.totalPages} (총 ${orders.totalElements}개)|"></small>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
