<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title layout:fragment="title">Beansolid - 주문 목록</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container mt-4" style="max-width: 1200px;">
        <div class="row">
            <div class="col-12">
                <!-- 성공/실패 메시지 표시 -->
                <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${message}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <h3 class="mb-4">주문 목록</h3>

                <div th:if="${orders.content.size() > 0}">
                    <div class="table-responsive">
                        <table class="table table-striped table-bordered">
                            <thead class="table-dark">
                            <tr>
                                <th>주문 번호</th>
                                <th>주문 날짜</th>
                                <th>수령인</th>
                                <th>주문 금액</th>
                                <th>상태</th>
                                <th>관리</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="order : ${orders.content}">
                                <td><a th:href="@{/mypage/orders/{orderNumber}(orderNumber=${order.orderNumber})}" th:text="${order.orderNumber}" class="text-decoration-none"></a></td>
                                <td th:text="${order.orderDate}"></td>
                                <td th:text="${order.receiverName}"></td>
                                <td th:text="${#numbers.formatInteger(order.totalPrice, 3, 'COMMA')} + '원'" class="text-end"></td>
                                <td>
                                    <span class="badge bg-primary" th:text="${order.status}"></span>
                                </td>
                                <td>
                                    <!-- 결제 대기 상태일 때 결제취소 버튼 -->
                                    <button th:if="${order.status == 'PENDING_PAY'}" type="button" class="btn btn-danger btn-sm"
                                            data-bs-toggle="modal" data-bs-target="#actionModal"
                                            th:attr="data-order-number=${order.orderNumber}, data-action-type='cancel'">
                                        결제취소
                                    </button>
                                    <!-- 완료 상태일 때 반품신청 버튼 -->
                                    <button th:if="${order.status == 'COMPLETED'}" type="button" class="btn btn-warning btn-sm"
                                            data-bs-toggle="modal" data-bs-target="#actionModal"
                                            th:attr="data-order-number=${order.orderNumber}, data-action-type='return'">
                                        반품신청
                                    </button>
                                    <!-- 다른 상태일 때는 버튼 없음 -->
                                    <span th:if="${order.status != 'PENDING_PAY' && order.status != 'COMPLETED'}" class="text-muted">-</span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div th:if="${orders.content.size() == 0}" class="alert alert-info text-center">
                    <p class="mb-0">주문 내역이 없습니다.</p>
                </div>

                <!-- 페이지네이션 -->
                <div th:if="${orders.totalPages > 1}" class="d-flex justify-content-center mt-4">
                    <nav aria-label="Page navigation">
                        <ul class="pagination">
                            <li class="page-item" th:classappend="${!orders.hasPrevious()} ? 'disabled' : ''">
                                <a class="page-link" th:if="${orders.hasPrevious()}"
                                   th:href="@{/mypage/orders(page=${orders.number - 1}, size=${orders.size})}">이전</a>
                                <span class="page-link" th:unless="${orders.hasPrevious()}">이전</span>
                            </li>

                            <li th:each="i : ${#numbers.sequence(0, orders.totalPages - 1)}"
                                class="page-item" th:classappend="${i == orders.number} ? 'active' : ''">
                                <a th:if="${i != orders.number}" class="page-link"
                                   th:href="@{/mypage/orders(page=${i}, size=${orders.size})}"
                                   th:text="${i + 1}"></a>
                                <span th:if="${i == orders.number}" class="page-link"
                                      th:text="${i + 1}"></span>
                            </li>

                            <li class="page-item" th:classappend="${!orders.hasNext()} ? 'disabled' : ''">
                                <a class="page-link" th:if="${orders.hasNext()}"
                                   th:href="@{/mypage/orders(page=${orders.number + 1}, size=${orders.size})}">다음</a>
                                <span class="page-link" th:unless="${orders.hasNext()}">다음</span>
                            </li>
                        </ul>
                    </nav>
                </div>

                <!-- 페이지 정보 -->
                <div th:if="${orders.totalPages > 0}" class="text-center mt-2 text-muted">
                    <small th:text="|페이지 ${orders.number + 1} / ${orders.totalPages} (총 ${orders.totalElements}개)|"></small>
                </div>
            </div>
        </div>
    </div>

    <!-- 공통 액션 모달 (반품/결제취소) -->
    <div class="modal fade" id="actionModal" tabindex="-1" aria-labelledby="actionModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="actionModalLabel">반품 신청</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="actionForm" method="post">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="actionReason" class="form-label">반품 사유</label>
                            <textarea class="form-control" id="actionReason" name="reason" rows="3" required></textarea>
                        </div>
                        <div class="form-check" id="damagedCheckbox">
                            <input class="form-check-input" type="checkbox" id="damaged" name="damaged" value="true">
                            <label class="form-check-label" for="damaged">
                                상품이 파손되었습니까?
                            </label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                        <button type="submit" class="btn btn-primary" id="actionSubmitBtn">반품 접수</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const actionModal = document.getElementById('actionModal');
            actionModal.addEventListener('show.bs.modal', function (event) {
                const button = event.relatedTarget;
                const orderNumber = button.getAttribute('data-order-number');
                const actionType = button.getAttribute('data-action-type');
                
                const modalTitle = document.getElementById('actionModalLabel');
                const reasonLabel = document.querySelector('label[for="actionReason"]');
                const damagedCheckbox = document.getElementById('damagedCheckbox');
                const submitBtn = document.getElementById('actionSubmitBtn');
                const form = document.getElementById('actionForm');
                
                if (actionType === 'cancel') {
                    // 결제취소 모드
                    modalTitle.textContent = '결제 취소';
                    reasonLabel.textContent = '결제 취소 사유';
                    damagedCheckbox.style.display = 'none';
                    submitBtn.textContent = '결제 취소';
                    submitBtn.className = 'btn btn-danger';
                    form.action = '/mypage/orders/' + orderNumber + '/cancel';
                } else {
                    // 반품 모드
                    modalTitle.textContent = '반품 신청';
                    reasonLabel.textContent = '반품 사유';
                    damagedCheckbox.style.display = 'block';
                    submitBtn.textContent = '반품 접수';
                    submitBtn.className = 'btn btn-primary';
                    form.action = '/mypage/orders/' + orderNumber + '/return';
                }
                
                // 폼 초기화
                document.getElementById('actionReason').value = '';
                document.getElementById('damaged').checked = false;
            });
        });
    </script>
</div>
</body>
</html>
