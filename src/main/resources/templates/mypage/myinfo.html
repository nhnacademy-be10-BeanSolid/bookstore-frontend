<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title layout:fragment="title">내 정보</title>
</head>

<div layout:fragment="content" class="container py-5">
    <div class="text-center mb-4">
        <h1 class="h2 fw-bold">내 정보</h1>
        <hr>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title mb-3">회원 정보 상세</h5>
            <dl class="row">
                <dt class="col-sm-4">아이디:</dt>
                <dd class="col-sm-8" th:text="${user.userId}"></dd>

                <dt class="col-sm-4">이름:</dt>
                <dd class="col-sm-8" th:text="${user.userName}"></dd>

                <dt class="col-sm-4">전화번호:</dt>
                <dd class="col-sm-8" th:text="${user.userPhoneNumber}"></dd>

                <dt class="col-sm-4">이메일:</dt>
                <dd class="col-sm-8" th:text="${user.userEmail}"></dd>

                <dt class="col-sm-4">생년월일:</dt>
                <dd class="col-sm-8" th:text="${user.userBirth}"></dd>

                <dt class="col-sm-4">포인트:</dt>
                <dd class="col-sm-8" th:text="${user.userPoint}"></dd>

                <dt class="col-sm-4">마지막 로그인:</dt>
                <dd class="col-sm-8" th:text="${#strings.replace(user.lastLoginAt, 'T', ' ')}"></dd>

                <dt class="col-sm-4">내 등급:</dt>
                <dd class="col-sm-8" th:text="${user.userGradeName}"></dd>
            </dl>
        </div>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-4">
        <button type="button" class="btn btn-primary" onclick="location.href='/mypage/edit'">회원정보 수정</button>
        <button type="button" th:if="${userType == 'LOCAL'}" class="btn btn-secondary" onclick="location.href='/mypage/editpassword'">비밀번호 변경</button>
        <a th:href="@{/mypage}" class="btn btn-outline-secondary">
            마이페이지로 돌아가기
        </a>
    </div>
</div>

</html>
