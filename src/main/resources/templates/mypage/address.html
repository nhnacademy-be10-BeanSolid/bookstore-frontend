<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title layout:fragment="title">내 주소 관리</title>
</head>

<div layout:fragment="content" class="container py-5 flex-grow-1">
    <div class="text-center mb-5">
        <h1 class="h2 fw-bold">내 주소 관리</h1>
        <hr>
    </div>

    <table class="table table-hover text-center">
        <thead class="table-light">
        <tr>
            <th style="width: 20%;">별칭</th>
            <th>상세 주소</th>
            <th style="width: 15%;">관리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="address : ${addresses}">
            <td th:text="${address.addressNickName}">별칭</td>
            <td class="text-start" th:text="${address.addressDetail}">상세 주소</td>
            <td>
                <button type="button" class="btn btn-sm btn-outline-danger" th:attr="onclick=|deleteAddress(${address.addressId})|">삭제</button>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="d-flex justify-content-end mt-4">
        <a href="/mypage" class="btn btn-secondary me-2">마이페이지로 돌아가기</a>
        <a href="/mypage/address/register" class="btn btn-primary">새 주소 등록</a>
    </div>
</div>

<div layout:fragment="scripts">
    <script>
      function deleteAddress(addressId) {
        if (!confirm('정말로 삭제하시겠습니까?')) {
          return;
        }

        fetch('/mypage/address/' + addressId, {
          method: 'DELETE'
        })
                .then(response => {
                  if (response.ok) {
                    alert('삭제되었습니다.');
                    location.reload();
                  } else {
                    alert('삭제에 실패했습니다.');
                  }
                })
                .catch(error => {
                  console.error('Error:', error);
                  alert('삭제 요청 중 오류가 발생했습니다.');
                });
      }
    </script>
    <script th:if="${errorMessage}" th:inline="javascript">
      alert('[[${errorMessage}]]');
    </script>
</div>

</html>
