<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title layout:fragment="title">포인트 내역</title>
</head>

<div layout:fragment="content" class="container py-5">
    <div class="text-center mb-4">
        <h1 class="h2 fw-bold">포인트 내역</h1>
        <hr>
    </div>

    

    <div class="mb-4 text-end">
        <span class="fs-5 fw-bold">현재 포인트: </span>
        <span class="fs-5 text-primary fw-bold" th:text="${newPoint}">0</span>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle text-center">
            <thead class="table-light">
            <tr>
                <th>Point ID</th>
                <th>User ID</th>
                <th>Type ID</th>
                <th>Order ID</th>
                <th>Earned/Used At</th>
                <th>Earned/Used Point</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="point : ${points}">
                <td th:text="${point.pointId}"></td>
                <td th:text="${point.userId}"></td>
                <td th:text="${point.typeId}"></td>
                <td th:text="${point.orderId}"></td>
                <td th:text="${#temporals.format(point.earnedAndUsedAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                <td th:text="${point.earnedAndUsedPoint}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 페이지네이션 -->
    <nav aria-label="Page navigation" class="d-flex justify-content-center mt-4">
        <ul class="pagination">
            <li class="page-item" th:classappend="${!page.hasPrevious()} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/mypage/point(page=${page.number - 1}, size=${page.size})}"
                   th:if="${page.hasPrevious()}">이전</a>
                <span class="page-link" th:unless="${page.hasPrevious()}">이전</span>
            </li>
            <li class="page-item active">
                <span class="page-link">
                    현재 페이지: <span th:text="${page.number + 1}">1</span>
                </span>
            </li>
            <li class="page-item" th:classappend="${!page.hasNext()} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/mypage/point(page=${page.number + 1}, size=${page.size})}"
                   th:if="${page.hasNext()}">다음</a>
                <span class="page-link" th:unless="${page.hasNext()}">다음</span>
            </li>
        </ul>
    </nav>

    <div class="d-flex justify-content-end mt-3">
        <a th:href="@{/mypage}" class="btn btn-outline-secondary">
            마이페이지로 돌아가기
        </a>
    </div>
</div>

</html>
