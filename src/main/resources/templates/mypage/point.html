<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>포인트 내역</title>
    <meta charset="UTF-8">
</head>
<body>
<h1>포인트 내역</h1>

<div>
    <strong>현재 포인트:</strong>
    <span th:text="${newPoint}">0</span>
</div>

<table border="1">
    <thead>
    <tr>
        <th>Point ID</th>
        <th>User ID</th>
        <th>Type ID</th>
        <th>Order No</th>
        <th>Earned/Used At</th>
        <th>Earned/Used Point</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="point : ${points}">
        <td th:text="${point.pointId}"></td>
        <td th:text="${point.userId}"></td>
        <td th:text="${point.typeId}"></td>
        <td th:text="${point.orderNo}"></td>
        <td th:text="${#temporals.format(point.earnedAndUsedAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
        <td th:text="${point.earnedAndUsedPoint}"></td>
    </tr>
    </tbody>
</table>

<div>
    <a th:if="${page.hasPrevious()}" th:href="@{/admin/categories(page=${page.number - 1}, size=${page.size})}">이전</a>
    <span>현재 페이지: <span th:text="${page.number + 1}">1</span></span>
    <a th:if="${page.hasNext()}" th:href="@{/admin/categories(page=${page.number + 1}, size=${page.size})}">다음</a>
</div>
</body>
</html>
