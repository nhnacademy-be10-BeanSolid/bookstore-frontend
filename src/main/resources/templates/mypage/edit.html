<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>개인정보 수정</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container py-5">
<h2 class="mb-4">개인정보 수정</h2>
<form th:action="@{/mypage/edit}" method="post">
    <div class="mb-3">
        <label for="userName" class="form-label">이름</label>
        <input type="text" class="form-control" id="userName" name="userName" th:value="${user.userName}" required>
    </div>
    <div class="mb-3">
        <label for="userPhoneNumber" class="form-label">휴대폰 번호</label>
        <input type="text" class="form-control" id="userPhoneNumber" name="userPhoneNumber" placeholder="010-1234-5678" th:value="${user.userPhoneNumber}" required>
    </div>
    <div class="mb-3">
        <label for="userEmail" class="form-label">이메일</label>
        <input type="email" class="form-control" id="userEmail" name="userEmail" th:value="${user.userEmail}" required>
    </div>
    <div class="mb-3">
        <label for="userBirth" class="form-label">생년월일</label>
        <input type="date" class="form-control" id="userBirth" name="userBirth" th:value="${user.userBirth}" required>
    </div>
    <button type="submit" id="submitBtn" class="btn btn-primary">수정하기</button>
</form>
</body>
</html>

<script>
    document.getElementById('submitBtn').addEventListener('click', function (event) {
        event.preventDefault();

        const form = document.querySelector('form');
        if (!form.checkValidity()) {
            form.reportValidity();
            return;
        }

        const data = {
            userName: document.getElementById('userName').value,
            userPhoneNumber: document.getElementById('userPhoneNumber').value,
            userEmail: document.getElementById('userEmail').value,
            userBirth: document.getElementById('userBirth').value
        };

        fetch('/mypage/edit', {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
            .then(async response => {
                if (response.ok) {
                    alert('개인정보 수정 완료!');
                    window.location.href = '/mypage';
                } else {
                    const errorData = await response.json();
                    alert(`수정 실패: ${errorData.message || '알 수 없는 오류'}`);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('수정 요청 중 네트워크 오류가 발생했습니다.');

            });

    });
</script>
