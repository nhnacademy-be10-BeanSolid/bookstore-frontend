<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head>
    <meta charset="UTF-8">
    <title>개인정보 수정</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container py-5">
<h2 class="mb-4">개인정보 수정</h2>


<!-- 개인정보 수정 form -->
<form id="editForm" method="post" th:action="@{/mypage/edit}">
    <div th:if="${userType == 'LOCAL'}" class="mb-3">
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <label for="password" class="form-label">현재 비밀번호</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="현재 비밀번호 입력" required/>
    </div>
    <div class="mb-3">
        <label for="userName" class="form-label">이름</label>
        <input type="text" class="form-control" id="userName" name="userName" th:value="${user.userName}" required>
    </div>
    <div class="mb-3">
        <label for="userPhoneNumber" class="form-label">휴대폰 번호</label>
        <input type="text" class="form-control" id="userPhoneNumber" name="userPhoneNumber" placeholder="010-1234-5678" th:value="${user.userPhoneNumber}" required>
    </div>
    <div class="mb-3">
        <label for="userEmail" class="form-label">이메일</label>
        <input type="email" class="form-control" id="userEmail" name="userEmail" th:value="${user.userEmail}" required>
    </div>
    <div class="mb-3">
        <label for="userBirth" class="form-label">생년월일</label>
        <input type="date" class="form-control" id="userBirth" name="userBirth" th:value="${user.userBirth}" required>
    </div>
    <button type="submit" id="submitBtn" class="btn btn-primary">수정하기</button>
</form>

</body>
</html>
