<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마이페이지</title>
</head>
<body>
<h1>마이페이지</h1>

<ul>
    <li>
        <a href="/mypage/address">회원주소 관리</a>
    </li>
    <li>
        <a href="/mypage/grade">회원등급 확인</a>
    </li>
    <li>
        <a href="/mypage/edit">회원정보 수정(테스트용임 추후 삭제필요)</a>
    </li>
    <li>
        <a href="/mypage/myinfo">내 정보</a>
    </li>
</ul>

<!-- 탈퇴 버튼 -->
<button
        th:if="${userType == 'OAUTH2'}"
        type="button"
        onclick="confirmOAuth2Withdrawal()">
    회원 탈퇴
</button>

<button
        th:if="${userType == 'LOCAL'}"
        type="button"
        onclick="showPasswordModal()">
    회원 탈퇴
</button>

<!-- OAuth2 단순 확인 -->
<script>
    function confirmOAuth2Withdrawal() {
        if (confirm('OAuth2 계정은 비밀번호 없이 즉시 탈퇴됩니다.\n정말로 탈퇴하시겠습니까?')) {
            document.getElementById('withdrawalForm').submit();
        }
    }
</script>

<!-- 일반 사용자 비밀번호 확인 모달 -->
<div id="passwordModal" style="display:none;">
    <p>정말로 탈퇴하시겠습니까? 비밀번호를 입력해 주세요.</p>
    <input type="password" id="confirmPassword" placeholder="비밀번호 입력" />
    <button onclick="submitWithPassword()">탈퇴하기</button>
    <button onclick="closePasswordModal()">취소</button>
</div>

<script>
    function showPasswordModal() {
        document.getElementById('passwordModal').style.display = 'block';
    }

    function closePasswordModal() {
        document.getElementById('passwordModal').style.display = 'none';
    }

    function submitWithPassword() {
        const pwd = document.getElementById('confirmPassword').value;
        const form = document.getElementById('withdrawalForm');
        // 비밀번호를 hidden input에 담아 전송
        let input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'password';
        input.value = pwd;
        form.appendChild(input);
        form.submit();
    }
</script>

<!-- 탈퇴 처리 폼 -->
<form id="withdrawalForm" th:action="@{/mypage/withdraw}" method="post">
    <!-- CSRF 토큰 등 -->
</form>


</body>
</html>
