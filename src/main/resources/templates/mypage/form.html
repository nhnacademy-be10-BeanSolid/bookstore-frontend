<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title layout:fragment="title">마이페이지</title>
</head>

<div layout:fragment="content" class="container py-5 flex-grow-1">
    <div class="text-center mb-4">
        <h1 class="h2 fw-bold">마이페이지</h1>
        <hr>
    </div>


    <ul class="list-group mb-4">
        <li class="list-group-item">
            <a href="/mypage/address" class="text-decoration-none">회원주소 관리</a>
        </li>
        <li class="list-group-item">
            <a href="/mypage/point" class="text-decoration-none">회원포인트내역 확인</a>
        </li>
        <li class="list-group-item">
            <a href="/mypage/grade" class="text-decoration-none">회원등급 확인</a>
        </li>
        <li class="list-group-item">
            <a href="/mypage/orders" class="text-decoration-none">주문관리</a>
        </li>
        
        <li class="list-group-item">
            <a href="/mypage/myinfo" class="text-decoration-none">내 정보</a>
        </li>
        <li class="list-group-item">
            <a th:href="@{/reviews/user/{userId}(userId=${loginUserId})}" class="text-decoration-none">내 리뷰</a>
        </li>
        <li class="list-group-item">
            <a th:href="@{/mypage/book-likes}" class="text-decoration-none">내 좋아요 목록</a>
        </li>
    </ul>

    <!-- 버튼들을 가로로 나란히 배치 -->
    <div class="d-flex mb-4">
        <button
                th:if="${userType == 'OAUTH2'}"
                type="button"
                class="btn btn-danger"
                id="oauth2WithdrawalBtn">
            회원 탈퇴
        </button>
        <button
                th:if="${userType == 'LOCAL'}"
                type="button"
                class="btn btn-danger"
                id="localWithdrawalBtn">
            회원 탈퇴
        </button>
    </div>

    <!-- 탈퇴 처리 폼 -->
    <form id="withdrawalForm" th:action="@{/mypage/withdraw}" method="post" style="display:none;">
        <!-- CSRF 토큰 등 -->
        <!-- 예시: <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /> -->
    </form>

    <!-- 일반 사용자 비밀번호 확인 모달 (Bootstrap Modal) -->
    <div class="modal fade" id="passwordModal" tabindex="-1" aria-labelledby="passwordModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="passwordModalLabel">회원 탈퇴 확인</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    <p>정말로 탈퇴하시겠습니까? 비밀번호를 입력해 주세요.</p>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="비밀번호 입력" />
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" id="submitWithPasswordBtn">탈퇴하기</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="scripts">
    <script>
        document.addEventListener('DOMContentLoaded', function () {

            const oauth2WithdrawalBtn = document.getElementById('oauth2WithdrawalBtn');
            const localWithdrawalBtn = document.getElementById('localWithdrawalBtn');
            const passwordModalElement = document.getElementById('passwordModal');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const withdrawalForm = document.getElementById('withdrawalForm');
            const submitWithPasswordBtn = document.getElementById('submitWithPasswordBtn');

            if (oauth2WithdrawalBtn) {
                oauth2WithdrawalBtn.addEventListener('click', function() {
                    if (confirm('OAuth2 계정은 비밀번호 없이 즉시 탈퇴됩니다.\n정말로 탈퇴하시겠습니까?')) {
                        withdrawalForm.submit();
                    }
                });
            }

            if (localWithdrawalBtn) {
                localWithdrawalBtn.addEventListener('click', function() {
                    const currentPasswordModalElement = document.getElementById('passwordModal'); // 클릭 시점에 다시 가져오기
                    if (currentPasswordModalElement) {
                        const passwordModal = new bootstrap.Modal(currentPasswordModalElement);
                        passwordModal.show();
                    }
                });
            }

            if (submitWithPasswordBtn) {
                submitWithPasswordBtn.addEventListener('click', function() {
                    const pwd = confirmPasswordInput.value;
                    let input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'password';
                    input.value = pwd;
                    withdrawalForm.appendChild(input);
                    withdrawalForm.submit();
                });
            }
        });
    </script>
</div>

</html>
