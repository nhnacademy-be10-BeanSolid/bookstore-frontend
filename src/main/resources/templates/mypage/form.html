<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마이페이지</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h1 class="mb-4">마이페이지</h1>

    <ul class="list-group mb-4">
        <li class="list-group-item">
            <a href="/mypage/address" class="text-decoration-none">회원주소 관리</a>
        </li>
        <li class="list-group-item">
            <a href="/mypage/point" class="text-decoration-none">회원포인트내역 확인</a>
        </li>
        <li class="list-group-item">
            <a href="/mypage/grade" class="text-decoration-none">회원등급 확인</a>
        </li>
        <li class="list-group-item">
            <a href="/mypage/edit" class="text-decoration-none">회원정보 수정(테스트용임 추후 삭제필요)</a>
        </li>
        <li class="list-group-item">
            <a href="/mypage/myinfo" class="text-decoration-none">내 정보</a>
        </li>
    </ul>

    <!-- 버튼들을 가로로 나란히 배치 -->
    <div class="d-flex mb-4">
        <a href="/" class="btn btn-secondary me-2">메인화면으로 가기</a>
        <button
                th:if="${userType == 'OAUTH2'}"
                type="button"
                class="btn btn-danger"
                onclick="confirmOAuth2Withdrawal()">
            회원 탈퇴
        </button>
        <button
                th:if="${userType == 'LOCAL'}"
                type="button"
                class="btn btn-danger"
                onclick="showPasswordModal()">
            회원 탈퇴
        </button>
    </div>

    <!-- 탈퇴 처리 폼 -->
    <form id="withdrawalForm" th:action="@{/mypage/withdraw}" method="post" style="display:none;">
        <!-- CSRF 토큰 등 -->
        <!-- 예시: <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /> -->
    </form>
</div>

<!-- 일반 사용자 비밀번호 확인 모달 (Bootstrap Modal) -->
<div class="modal fade" id="passwordModal" tabindex="-1" aria-labelledby="passwordModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="passwordModalLabel">회원 탈퇴 확인</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
            </div>
            <div class="modal-body">
                <p>정말로 탈퇴하시겠습니까? 비밀번호를 입력해 주세요.</p>
                <input type="password" id="confirmPassword" class="form-control" placeholder="비밀번호 입력" />
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger" onclick="submitWithPassword()">탈퇴하기</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS (Popper 포함) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function confirmOAuth2Withdrawal() {
        if (confirm('OAuth2 계정은 비밀번호 없이 즉시 탈퇴됩니다.\n정말로 탈퇴하시겠습니까?')) {
            document.getElementById('withdrawalForm').submit();
        }
    }

    function showPasswordModal() {
        // Bootstrap 5 모달 객체 생성 및 표시
        const modal = new bootstrap.Modal(document.getElementById('passwordModal'));
        modal.show();
    }

    function submitWithPassword() {
        const pwd = document.getElementById('confirmPassword').value;
        const form = document.getElementById('withdrawalForm');
        // 비밀번호를 hidden input에 담아 전송
        let input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'password';
        input.value = pwd;
        form.appendChild(input);
        form.submit();
    }
</script>
</body>
</html>
