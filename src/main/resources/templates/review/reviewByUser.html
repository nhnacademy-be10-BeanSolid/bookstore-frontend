<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>내 리뷰 목록</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5">
<h1 class="mb-4 text-center">리뷰 목록</h1>

<div th:if="${#lists.isEmpty(reviews)}">
    <p>리뷰가 없습니다.</p>
</div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle text-center">
            <thead class="table-light">
            <tr>
                <th>Book ID</th>
                <th>평점</th>
                <th>내용</th>
                <th>작성일</th>
                <th>상세보기</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="review : ${reviews}">
                <td th:text="${review.bookId}"></td>
                <td th:text="${review.evaluationScore} + '점'"></td>
                <td th:text="${#strings.abbreviate(review.reviewContent, 100)}"></td>
                <td th:text="${#temporals.format(review.reviewedAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                <td>
                    <a th:href="@{/reviews/{reviewId}(reviewId=${review.reviewId})}" class="btn btn-primary btn-sm">상세보기</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

<!-- 페이지네이션 -->
<nav aria-label="Page navigation" class="d-flex justify-content-center mt-4">
    <ul class="pagination">
        <li class="page-item" th:classappend="${!page.hasPrevious()} ? 'disabled'">
            <a class="page-link"
               th:href="@{/reviews/user/{userId}(userId=${userId}, page=${page.number - 1}, size=${page.size})}"
               th:if="${page.hasPrevious()}">이전</a>
            <span class="page-link" th:unless="${page.hasPrevious()}">이전</span>
        </li>
        <li class="page-item active">
                <span class="page-link">
                    현재 페이지: <span th:text="${page.number + 1}">1</span>
                </span>
        </li>
        <li class="page-item" th:classappend="${!page.hasNext()} ? 'disabled'">
            <a class="page-link"
               th:href="@{/reviews/user/{userId}(userId=${userId}, page=${page.number + 1}, size=${page.size})}"
               th:if="${page.hasNext()}">다음</a>
            <span class="page-link" th:unless="${page.hasNext()}">다음</span>
        </li>
    </ul>
</nav>
</div>
<!-- Bootstrap JS (optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
