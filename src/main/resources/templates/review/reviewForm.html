<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>리뷰 작성</title>
</head>
<body>
<h1>리뷰 작성</h1>

<div th:if="${!hasPurchased}">
    <p>이 도서에 대한 구매 기록이 없어 리뷰를 작성할 수 없습니다.</p>
    <button type="button" onclick="history.back()">뒤로 가기</button>
</div>

<form id="reviewForm" enctype="multipart/form-data" th:action="@{/reviews/create}" method="post" th:if="${hasPurchased}">
    <!-- 사용자 ID (숨김) -->
    <input type="hidden" id="userId" name="userId" th:value="${loginUserId}"/>

    <!-- 도서 ID (숨김 또는 템플릿 주입) -->
    <input type="hidden" id="bookId" name="bookId" th:value="${bookId}"/>

    <!-- 평가 점수 -->
    <label for="evaluationScore">평가 점수 (1~5):</label>
    <input type="number" id="evaluationScore" name="evaluationScore" min="1" max="5" required><br><br>

    <!-- 리뷰 내용 -->
    <label for="reviewContent">리뷰 내용:</label><br>
    <textarea id="reviewContent" name="reviewContent" rows="5" cols="50" required></textarea><br><br>

    <!-- 이미지 업로드 -->
    <label for="images">이미지 첨부:</label>
    <input type="file" id="images" name="images" multiple accept="image/*"><br><br>
    <div id="previewContainer"></div>
    <br>

    <button type="submit">리뷰 등록</button>
</form>

<script th:if="${hasPurchased}">
    const imageInput = document.getElementById("images");
    const previewContainer = document.getElementById("previewContainer");
    let selectedFiles = [];

    imageInput.addEventListener("change", function () {
        previewContainer.innerHTML = "";
        selectedFiles = Array.from(imageInput.files);

        selectedFiles.forEach((file, index) => {
            const reader = new FileReader();
            reader.onload = function (e) {
                const div = document.createElement("div");
                div.style.display = "inline-block";
                div.style.margin = "10px";

                const img = document.createElement("img");
                img.src = e.target.result;
                img.style.width = "100px";
                img.style.height = "100px";
                img.style.objectFit = "cover";

                const btn = document.createElement("button");
                btn.textContent = "❌";
                btn.type = "button";
                btn.onclick = function () {
                    selectedFiles.splice(index, 1);
                    updatePreview();
                };

                div.appendChild(img);
                div.appendChild(btn);
                previewContainer.appendChild(div);
            };
            reader.readAsDataURL(file);
        });
    });

    function updatePreview() {
        const dataTransfer = new DataTransfer();
        selectedFiles.forEach(file => dataTransfer.items.add(file));
        imageInput.files = dataTransfer.files;
        imageInput.dispatchEvent(new Event('change')); // 다시 그려줌
    }

    document.getElementById("reviewForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const userId = document.getElementById("userId").value;
        const bookId = document.getElementById("bookId").value;
        const evaluationScore = parseInt(document.getElementById("evaluationScore").value);
        const reviewContent = document.getElementById("reviewContent").value;

        if (!evaluationScore || evaluationScore < 1 || evaluationScore > 5) {
            alert("평가 점수는 1~5 사이의 숫자여야 합니다.");
            return;
        }

        const review = {
            userId: userId,
            bookId: parseInt(bookId),
            evaluationScore: evaluationScore,
            reviewContent: reviewContent
        };

        const formData = new FormData();
        formData.append("review", new Blob([JSON.stringify(review)], { type: "application/json" }));

        for (let file of selectedFiles) {
            formData.append("images", file);
        }

        try {
            const response = await fetch("/reviews/create", {
                method: "POST",
                body: formData
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.message || "리뷰 등록 실패");
            }

            alert("리뷰가 등록되었습니다.");
            window.location.href = "/";
        } catch (err) {
            alert(err.message);
        }
    });
</script>

</body>
</html>
