<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="ko"
      layout:decorate="~{layout/layout}">
<head>
    <title layout:fragment="title">리뷰 작성</title>
    <!-- 부트스트랩 CSS는 레이아웃에 포함되어 있다면 생략 -->
</head>
<body>
<div layout:fragment="content" class="container my-5">

    <h1 class="mb-4">리뷰 작성</h1>

    <div th:if="${!hasPurchased}" class="alert alert-warning">
        <p>이 도서에 대한 구매 기록이 없어 리뷰를 작성할 수 없습니다.</p>
        <button type="button" class="btn btn-secondary" onclick="history.back()">뒤로 가기</button>
    </div>

    <form id="reviewForm" enctype="multipart/form-data" th:action="@{/reviews/create}" method="post"
          th:if="${hasPurchased}"
          class="needs-validation" novalidate>
        <!-- 사용자 ID (숨김) -->
        <input type="hidden" id="userId" name="userId" th:value="${loginUserId}"/>
        <!-- 도서 ID (숨김 또는 템플릿 주입) -->
        <input type="hidden" id="bookId" name="bookId" th:value="${bookId}"/>

        <!-- 평가 점수 -->
        <div class="mb-3">
            <label for="evaluationScore" class="form-label">평가 점수 (1~5):</label>
            <input type="number" id="evaluationScore" name="evaluationScore" min="1" max="5"
                   required class="form-control"/>
            <div class="invalid-feedback">
                1에서 5 사이의 숫자를 입력해주세요.
            </div>
        </div>

        <!-- 리뷰 내용 -->
        <div class="mb-3">
            <label for="reviewContent" class="form-label">리뷰 내용:</label>
            <textarea id="reviewContent" name="reviewContent" rows="5" required class="form-control"></textarea>
            <div class="invalid-feedback">
                리뷰 내용을 입력해주세요.
            </div>
        </div>

        <!-- 이미지 업로드 -->
        <div class="mb-3">
            <label for="images" class="form-label">이미지 첨부:</label>
            <input type="file" id="images" name="images" multiple accept="image/*" class="form-control"/>
        </div>

        <div id="previewContainer"></div>

        <button type="submit" class="btn btn-primary mt-3">리뷰 등록</button>
    </form>
</div>

<div layout:fragment="scripts">
    <!-- 부트스트랩 5 JS Bundle (Popper 포함) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script th:if="${hasPurchased}">
        const imageInput = document.getElementById("images");
        const previewContainer = document.getElementById("previewContainer");
        let selectedFiles = [];

        imageInput.addEventListener("change", function () {
            previewContainer.innerHTML = "";
            selectedFiles = Array.from(imageInput.files);

            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const div = document.createElement("div");
                    div.style.position = "relative";
                    div.style.display = "inline-block";
                    div.style.margin = "10px";

                    const img = document.createElement("img");
                    img.src = e.target.result;
                    img.className = "rounded";
                    img.style.width = "100px";
                    img.style.height = "100px";
                    img.style.objectFit = "cover";

                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "btn-close btn-close-position";
                    btn.ariaLabel = "Remove";
                    btn.onclick = function () {
                        selectedFiles.splice(index, 1);

                        // 새롭게 파일 리스트에 반영
                        const dataTransfer = new DataTransfer();
                        selectedFiles.forEach(file => dataTransfer.items.add(file));
                        imageInput.files = dataTransfer.files;
                        updatePreview();
                    };

                    div.appendChild(img);
                    div.appendChild(btn);
                    previewContainer.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
        });

        function updatePreview() {
            previewContainer.innerHTML = "";
            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const div = document.createElement("div");
                    div.style.position = "relative";
                    div.style.display = "inline-block";
                    div.style.margin = "10px";

                    const img = document.createElement("img");
                    img.src = e.target.result;
                    img.className = "rounded";
                    img.style.width = "100px";
                    img.style.height = "100px";
                    img.style.objectFit = "cover";

                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "btn-close btn-close-position";
                    btn.ariaLabel = "Remove";
                    btn.onclick = function () {
                        selectedFiles.splice(index, 1);

                        const dataTransfer = new DataTransfer();
                        selectedFiles.forEach(file => dataTransfer.items.add(file));
                        imageInput.files = dataTransfer.files;
                        updatePreview();
                    };

                    div.appendChild(img);
                    div.appendChild(btn);
                    previewContainer.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
        }

        document.getElementById("reviewForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            // 부트스트랩 기본 유효성 검사
            const form = e.target;
            if (!form.checkValidity()) {
                e.stopPropagation();
                form.classList.add('was-validated');
                return;
            }

            const userId = document.getElementById("userId").value;
            const bookId = document.getElementById("bookId").value;
            const evaluationScore = parseInt(document.getElementById("evaluationScore").value);
            const reviewContent = document.getElementById("reviewContent").value;

            if (!evaluationScore || evaluationScore < 1 || evaluationScore > 5) {
                alert("평가 점수는 1~5 사이의 숫자여야 합니다.");
                return;
            }

            const review = {
                userId: userId,
                bookId: parseInt(bookId),
                evaluationScore: evaluationScore,
                reviewContent: reviewContent
            };

            const formData = new FormData();
            formData.append("review", new Blob([JSON.stringify(review)], {type: "application/json"}));

            for (let file of selectedFiles) {
                formData.append("images", file);
            }

            try {
                const response = await fetch("/reviews/create", {
                    method: "POST",
                    body: formData
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.message || "리뷰 등록 실패");
                }

                alert("리뷰가 등록되었습니다.");
                window.location.href = "/";
            } catch (err) {
                alert(err.message);
            }
        });
    </script>
</div>
</body>
</html>
