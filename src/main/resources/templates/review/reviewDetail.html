<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="ko"
      layout:decorate="~{layout/layout}">
<head>
    <title layout:fragment="title">리뷰 상세</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet" />
</head>
<body>
<div layout:fragment="content" class="container my-5">
    <h1 class="mb-4">리뷰 상세</h1>

    <div class="mb-3">
        <strong class="fw-bold">작성자:</strong>
        <span th:text="${review.userId}" class="ms-2"></span>
    </div>

    <div class="mb-3">
        <strong class="fw-bold">도서 제목:</strong>
        <span th:text="${review.bookTitle}" class="ms-2"></span>
    </div>

    <div class="mb-3">
        <strong class="fw-bold">평점:</strong>
        <span th:text="${review.evaluationScore}" class="ms-2"></span>
    </div>

    <div class="mb-3">
        <strong class="fw-bold">내용:</strong>
        <p th:text="${review.reviewContent}" class="mt-2"></p>
    </div>

    <div class="mb-3">
        <strong class="fw-bold">작성일:</strong>
        <span th:text="${#temporals.format(review.reviewedAt, 'yyyy-MM-dd HH:mm')}" class="ms-2"></span>
    </div>

    <div class="mb-3">
        <strong class="fw-bold">수정일:</strong>
        <span th:text="${#temporals.format(review.updatedAt, 'yyyy-MM-dd HH:mm')}" class="ms-2"></span>
    </div>

    <div th:if="${review.reviewImages}">
        <h3 class="mt-5 mb-3">이미지</h3>
        <div class="d-flex flex-wrap gap-3">
            <div th:each="image : ${review.reviewImages}">
                <img th:src="${image}" class="img-fluid rounded" style="max-width: 300px;" alt="리뷰 이미지" />
            </div>
        </div>
    </div>

    <th:block th:if="${loginUserId != null and loginUserId == review.userId}">
        <a
                th:href="@{/reviews/edit/{reviewId}(reviewId=${review.reviewId})}"
                class="btn btn-primary btn-sm mt-4"
        >수정하기</a>
    </th:block>
</div>

<div layout:fragment="scripts">
    <!-- 만약 레이아웃에 부트스트랩 JS 포함이 안되어 있다면 여기에 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
