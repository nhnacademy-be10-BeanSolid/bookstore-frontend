<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>API Documentation</title>
    <!-- Swagger UI CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.1/swagger-ui.min.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div id="swagger-ui"></div>

    <!-- Swagger UI JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.1/swagger-ui-bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.1/swagger-ui-standalone-preset.min.js"></script>
    <script th:inline="javascript">
        window.onload = function() {
            // 컨트롤러에서 전달받은 swaggerConfig 객체
            const swaggerConfig = /*[[${swaggerConfig}]]*/ {};

            if (Object.keys(swaggerConfig).length === 0) {
                // swaggerConfig가 비어있거나 오류가 발생한 경우
                document.getElementById('swagger-ui').innerHTML = `
                    <div style="padding: 20px; color: red;">
                        Error loading Swagger UI: Could not retrieve Swagger configuration.
                        Please ensure the gateway is running and configured correctly.
                    </div>
                `;
                return;
            }

            // oauth2RedirectUrl에서 게이트웨이의 기본 URL을 추출합니다.
            // 예: "http://localhost:10342/webjars/swagger-ui/oauth2-redirect.html" -> "http://localhost:10342"
            const gatewayBaseUrl = new URL(swaggerConfig.oauth2RedirectUrl).origin;

            // 가져온 설정에서 'urls' 배열을 추출
            const urls = swaggerConfig.urls.map(item => ({
                // frontend 서비스의 새로운 API 문서 엔드포인트를 사용합니다.
                url: `/api-docs/${item.name.toLowerCase()}/v3/api-docs`,
                name: item.name
            }));

            // Swagger UI 초기화
            const ui = SwaggerUIBundle({
                urls: urls,
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout"
            });

            window.ui = ui;
        };
    </script>
</body>
</html>
