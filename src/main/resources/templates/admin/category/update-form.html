<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>카테고리 수정</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="card-title text-center mb-4">카테고리 수정</h1>
                    <form th:action="@{/admin/categories/{id}(id=${category.categoryId})}" method="post">
                        <input type="hidden" name="_method" value="put"/>
                        <div class="mb-3">
                            <label for="categoryName" class="form-label">카테고리 이름</label>
                            <input type="text" class="form-control" id="categoryName" name="categoryName"
                                   th:value="${category.categoryName}" required/>
                        </div>
                        <div class="mb-4">
                            <label for="parentId" class="form-label">부모 카테고리 ID</label>
                            <input type="number" class="form-control" id="parentId" name="parentId"
                                   th:value="${category.parentId}"/>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">수정</button>
                    </form>
                    <div class="mt-3 text-center">
                        <a href="/admin/categories" class="btn btn-secondary">카테고리 목록</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Bootstrap JS (optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
