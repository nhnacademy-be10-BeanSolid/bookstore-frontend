<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title layout:fragment="title">카테고리 수정</title>
</head>
<div layout:fragment="content" class="container py-5 flex-grow-1">
    <div class="text-center mb-5">
        <h2 class="h2 fw-bold">카테고리 수정</h2>
        <hr>
    </div>
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <form th:action="@{/admin/categories/{id}(id=${category.categoryId})}" method="post" id="updateCategoryForm">
                        <div class="mb-3">
                            <label for="categoryName" class="form-label">카테고리 이름</label>
                            <input type="text" class="form-control" id="categoryName" name="categoryName"
                                   th:value="${category.categoryName}" required/>
                        </div>
                        <div class="mb-4">
                            <label for="parentId" class="form-label">부모 카테고리 ID</label>
                            <input type="number" class="form-control" id="parentId" name="parentId"
                                   th:value="${category.parentId}"/>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">수정</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
