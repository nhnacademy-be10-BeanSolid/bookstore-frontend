<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
  <title layout:fragment="title">카테고리 목록</title>
</head>

<div layout:fragment="content" class="container py-5 flex-grow-1">
  <div class="text-center mb-5">
    <h1 class="h2 fw-bold">카테고리 목록</h1>
    <hr>
  </div>

  <div class="table-responsive shadow rounded">
    <table class="table table-bordered table-hover align-middle text-center">
      <thead class="table-light">
      <tr>
        <th>카테고리 ID</th>
        <th>카테고리 이름</th>
        <th>부모 카테고리 ID</th>
        <th>부모 카테고리 이름</th>
        <th>수정</th>
        <th>삭제</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="category : ${categories}">
        <td>
          <a href="#" class="category-detail-link"
             th:data-category-id="${category.categoryId}"
             data-bs-toggle="modal" data-bs-target="#categoryDetailModal"
             th:text="${category.categoryId}"></a>
        </td>
        <td th:text="${category.categoryName}"></td>
        <td th:text="${category.parentId}"></td>
        <td th:text="${category.parentCategoryName}"></td>
        <td>
          <button type="button" class="btn btn-outline-primary btn-sm category-update-link"
                  th:data-category-id="${category.categoryId}"
                  data-bs-toggle="modal" data-bs-target="#categoryUpdateModal">수정</button>
        </td>
        <td>
          <button type="button" class="btn btn-outline-danger btn-sm delete-category-btn"
                  th:data-category-id="${category.categoryId}">삭제</button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <!-- 페이지네이션 -->
  <nav aria-label="Page navigation" class="d-flex justify-content-center mt-4">
    <ul class="pagination">
        <li class="page-item" th:classappend="${page.number / 10 eq 0} ? 'disabled'">
            <a class="page-link" th:href="@{/admin/categories(page=${(page.number / 10 * 10) - 10}, size=${page.size})}" aria-label="Previous 10">
                <span aria-hidden="true">&laquo;</span>
            </a>
        </li>
        <li class="page-item" th:classappend="${page.number eq 0} ? 'disabled'">
            <a class="page-link" th:href="@{/admin/categories(page=${page.number - 1}, size=${page.size})}" aria-label="Previous">
                <span aria-hidden="true">&lt;</span>
            </a>
        </li>

        <li class="page-item" th:each="i : ${#numbers.sequence(page.number / 10 * 10, (page.number / 10 * 10) + 9 < page.totalPages ? (page.number / 10 * 10) + 9 : page.totalPages - 1)}"
            th:classappend="${i == page.number} ? 'active'">
            <a class="page-link" th:href="@{/admin/categories(page=${i}, size=${page.size})}" th:text="${i + 1}">1</a>
        </li>

        <li class="page-item" th:classappend="${page.number eq page.totalPages - 1} ? 'disabled'">
            <a class="page-link" th:href="@{/admin/categories(page=${page.number + 1}, size=${page.size})}" aria-label="Next">
                <span aria-hidden="true">&gt;</span>
            </a>
        </li>
        <li class="page-item" th:classappend="${(page.number / 10 * 10) + 9 >= page.totalPages - 1} ? 'disabled'">
            <a class="page-link" th:href="@{/admin/categories(page=${(page.number / 10 * 10) + 10}, size=${page.size})}" aria-label="Next 10">
                <span aria-hidden="true">&raquo;</span>
            </a>
        </li>
    </ul>
  </nav>

  <div class="d-flex justify-content-end mt-4">
    <button type="button" class="btn btn-success me-2" data-bs-toggle="modal" data-bs-target="#categoryCreateModal">카테고리 생성하기</button>
    <a th:href="@{/admin}" class="btn btn-secondary">관리자 페이지</a>
  </div>

  <!-- Category Detail Modal -->
  <div class="modal fade" id="categoryDetailModal" tabindex="-1" aria-labelledby="categoryDetailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="categoryDetailModalLabel">카테고리 상세 정보</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <!-- Detail content will be loaded here -->
          <div class="text-center">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Category Update Modal -->
  <div class="modal fade" id="categoryUpdateModal" tabindex="-1" aria-labelledby="categoryUpdateModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="categoryUpdateModalLabel">카테고리 수정</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <!-- Update form content will be loaded here -->
          <div class="text-center">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Category Create Modal -->
  <div class="modal fade" id="categoryCreateModal" tabindex="-1" aria-labelledby="categoryCreateModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="categoryCreateModalLabel">카테고리 생성</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <!-- Create form content will be loaded here -->
          <div class="text-center">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script layout:fragment="scripts">
  document.addEventListener('DOMContentLoaded', function() {
    var categoryDetailModal = document.getElementById('categoryDetailModal');
    categoryDetailModal.addEventListener('show.bs.modal', function (event) {
      var button = event.relatedTarget; // Button that triggered the modal
      var categoryId = button.getAttribute('data-category-id'); // Extract info from data-* attributes
      var modalBody = categoryDetailModal.querySelector('.modal-body');

      // Show spinner while loading
      modalBody.innerHTML = `
        <div class="text-center">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      `;

      // Fetch the detail content
      fetch(`/admin/categories/${categoryId}`)
        .then(response => {
          if (!response.ok) {
            throw new Error('Network response was not ok');
          }
          return response.text();
        })
        .then(html => {
          // Parse the fetched HTML to extract only the relevant content (e.g., the card-body)
          var parser = new DOMParser();
          var doc = parser.parseFromString(html, 'text/html');
          var detailContent = doc.querySelector('.card-body'); // Assuming detail content is within .card-body

          if (detailContent) {
            modalBody.innerHTML = detailContent.innerHTML;
          } else {
            modalBody.innerHTML = '<p class="text-danger text-center">상세 정보를 불러오는데 실패했습니다. (detailContent not found)</p>';
          }
        })
        .catch(error => {
          console.error('Error fetching category detail:', error);
          modalBody.innerHTML = '<p class="text-danger text-center">오류 발생: ' + error.message + '</p>';
        });
    });

    var categoryUpdateModal = document.getElementById('categoryUpdateModal');
    categoryUpdateModal.addEventListener('show.bs.modal', function (event) {
      var button = event.relatedTarget; // Button that triggered the modal
      var categoryId = button.getAttribute('data-category-id'); // Extract info from data-* attributes
      var modalBody = categoryUpdateModal.querySelector('.modal-body');

      // Show spinner while loading
      modalBody.innerHTML = `
        <div class="text-center">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      `;

      // Fetch the update form content
      fetch(`/admin/categories/${categoryId}/edit`)
        .then(response => {
          if (!response.ok) {
            throw new Error('Network response was not ok');
          }
          return response.text();
        })
        .then(html => {
          // Parse the fetched HTML to extract only the relevant content (e.g., the card-body)
          var parser = new DOMParser();
          var doc = parser.parseFromString(html, 'text/html');
          var updateFormContent = doc.querySelector('.card-body'); // Assuming update form content is within .card-body

          if (updateFormContent) {
            modalBody.innerHTML = updateFormContent.innerHTML;
          } else {
            modalBody.innerHTML = '<p class="text-danger text-center">수정 폼을 불러오는데 실패했습니다. (updateFormContent not found)</p>';
          }
        })
        .catch(error => {
          console.error('Error fetching category update form:', error);
          modalBody.innerHTML = '<p class="text-danger text-center">오류 발생: ' + error.message + '</p>';
        });
    });

    var categoryCreateModal = document.getElementById('categoryCreateModal');
    categoryCreateModal.addEventListener('show.bs.modal', function (event) {
      var modalBody = categoryCreateModal.querySelector('.modal-body');

      // Show spinner while loading
      modalBody.innerHTML = `
        <div class="text-center">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      `;

      // Fetch the create form content
      fetch(`/admin/categories/new`)
        .then(response => {
          if (!response.ok) {
            throw new Error('Network response was not ok');
          }
          return response.text();
        })
        .then(html => {
          // Parse the fetched HTML to extract only the relevant content (e.g., the card-body)
          var parser = new DOMParser();
          var doc = parser.parseFromString(html, 'text/html');
          var createFormContent = doc.querySelector('.card-body'); // Assuming create form content is within .card-body

          if (createFormContent) {
            modalBody.innerHTML = createFormContent.innerHTML;
            attachFormSubmitListener(modalBody.querySelector('#createCategoryForm'), 'categoryCreateModal');
          } else {
            modalBody.innerHTML = '<p class="text-danger text-center">생성 폼을 불러오는데 실패했습니다. (createFormContent not found)</p>';
          }
        })
        .catch(error => {
          console.error('Error fetching category create form:', error);
          modalBody.innerHTML = '<p class="text-danger text-center">오류 발생: ' + error.message + '</p>';
        });
    });

    function attachFormSubmitListener(form, modalId) {
        if (!form) return;
        if (form.dataset.listenerAttached) {
            console.log('Listener already attached to form:', form.id);
            return; // Listener already attached, do nothing
        }
        form.dataset.listenerAttached = 'true'; // Set flag
        console.log('Attaching listener to form:', form.id);

        form.addEventListener('submit', async function(event) {
            event.preventDefault(); // Prevent default form submission

            let url = form.action; // Declare url here
            const formData = new FormData(form);
            let data = {};

            if (form.id === 'updateCategoryForm') {
                data = Object.fromEntries(formData);
            } else if (form.id === 'createCategoryForm') {
                url = '/admin/categories'; // Reassign url for create form
                data = {
                    categoryName: formData.get('categoryName'),
                    parentId: formData.get('parentId') ? parseInt(formData.get('parentId')) : null
                };
            }

            let methodToUse;
            if (form.id === 'updateCategoryForm') {
                methodToUse = form.querySelector('input[name="_method"]') ? form.querySelector('input[name="_method"]').value.toUpperCase() : 'PUT';
            } else if (form.id === 'createCategoryForm') {
                methodToUse = 'POST';
            }

            try {
                console.log('Fetch URL:', url);
                console.log('Fetch Method:', methodToUse);
                console.log('Fetch Headers:', { 'Content-Type': 'application/json' });
                console.log('Fetch Body:', JSON.stringify(data));
                const response = await fetch(url, {
                    method: methodToUse,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    // Close the modal
                    const modalElement = document.getElementById(modalId);
                    const modal = bootstrap.Modal.getInstance(modalElement);
                    if (modal) {
                        modal.hide();
                    }
                    // Reload the page to reflect changes
                    location.reload();
                } else {
                    const errorText = await response.text();
                    alert('작업 실패: ' + errorText);
                }
            } catch (error) {
                console.error('Error during form submission:', error);
                alert('작업 중 오류가 발생했습니다.');
            }
        });
    }

    // Attach listener for update form when modal content is loaded
    categoryUpdateModal.addEventListener('shown.bs.modal', function () {
        attachFormSubmitListener(this.querySelector('#updateCategoryForm'), 'categoryUpdateModal');
    });

    // Attach listener for create form when modal content is loaded
    categoryCreateModal.addEventListener('shown.bs.modal', function () {
        attachFormSubmitListener(this.querySelector('#createCategoryForm'), 'categoryCreateModal');
    });

    // Handle category deletion using event delegation
    document.addEventListener('click', async function(event) {
        if (event.target.classList.contains('delete-category-btn')) {
            const button = event.target;
            const categoryId = button.getAttribute('data-category-id');
            if (confirm('정말 삭제하시겠습니까?')) {
                try {
                    const response = await fetch(`/admin/categories/${categoryId}`, {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });

                    if (response.ok) {
                        button.closest('tr').remove(); // Remove the row from the table
                        alert('카테고리가 성공적으로 삭제되었습니다.');
                    } else {
                        const errorText = await response.text();
                        alert('카테고리 삭제 실패: ' + errorText);
                    }
                } catch (error) {
                    console.error('Error during category deletion:', error);
                    alert('카테고리 삭제 중 오류가 발생했습니다.');
                }
            }
        }
    });
  });
</script>
</html>
