<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>포인트 적립 규정 관리</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            padding: 8px 12px;
            border: 1px solid #ddd;
            text-align: center;
        }
        th {
            background: #f4f4f4;
        }
        .action-btn {
            margin: 0 2px;
        }
        .pagination {
            margin-top: 20px;
        }
    </style>
</head>
<body>
<h1>포인트 적립 규정 목록</h1>

<table>
    <thead>
    <tr>
        <th>유형 ID</th>
        <th>유형 명</th>
        <th>적립 포인트</th>
        <th>적립 비율</th>
        <th>등급 명</th>
        <th>활성화 여부</th>
        <th>수정</th>
        <th>삭제</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="pointType : ${pointTypes}">
        <td th:text="${pointType.typeId}"></td>
        <td th:text="${pointType.typeName}"></td>
        <td th:text="${pointType.earningPoint}"></td>
        <td th:text="${pointType.earningRate} + '%'"></td>
        <td th:text="${pointType.gradeName}"></td>
        <td th:text="${pointType.isActive} ? '활성화' : '비활성화'"></td>
        <td>
            <a th:href="@{'/admin/pointType/edit/' + ${pointType.typeId}}">
                <button type="button" class="action-btn">수정</button>
            </a>
        </td>
        <td>
            <form th:action="@{'/admin/pointtype/' + ${pointType.typeId}}" method="post" style="margin:0;">
                <input type="hidden" name="_method" value="delete"/>
                <button type="submit" class="action-btn"
                        onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<!-- 등록 버튼 -->
<div style="margin-top:20px;">
    <a th:href="@{/admin/pointtype/register}">
        <button type="button">등록</button>
    </a>
</div>

<!-- 페이지네이션 -->
<div class="pagination">
    <a th:if="${page.hasPrevious()}"
       th:href="@{/admin(page=${page.number - 1}, size=${page.size})}">이전</a>
    <span>현재 페이지: <span th:text="${page.number + 1}">1</span></span>
    <a th:if="${page.hasNext()}"
       th:href="@{/admin(page=${page.number + 1}, size=${page.size})}">다음</a>
</div>

<script th:if="${registerSuccess != null}">
    alert('[[${registerSuccess}]]');
</script>

<script th:if="${registerFail != null}">
    alert('[[${registerFail}]]');
</script>

<script th:if="${deleteSuccess != null}">
    alert('[[${deleteSuccess}]]');
</script>

<script th:if="${deleteFail != null}">
    alert('[[${deleteFail}]]');
</script>

</body>
</html>
