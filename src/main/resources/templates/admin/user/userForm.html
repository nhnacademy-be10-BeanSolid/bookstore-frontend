<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>사용자 관리</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f6fa; }
        .table thead th {
            background: #f0f0f0;
            vertical-align: middle;
        }
        .table-striped > tbody > tr:hover {
            background-color: #f7faff;
        }
        .pagination .page-link:focus {
            box-shadow: none;
        }
        /* 반응형 처리 */
        @media (max-width: 768px) {
            .table-responsive { font-size: 0.94rem; }
            .container { padding: 0 0.6rem; }
        }
    </style>
</head>
<body>
<div class="container my-4">
    <h2 class="mb-4 fw-bold">회원 목록</h2>
    <div class="table-responsive shadow rounded">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th>아이디</th>
                <th>이름</th>
                <th>전화번호</th>
                <th>이메일</th>
                <th>생년월일</th>
                <th>포인트</th>
                <th>상태</th>
                <th>가입일</th>
                <th>마지막 로그인</th>
                <th>등급</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.userId}"></td>
                <td th:text="${user.userName}"></td>
                <td th:text="${user.userPhoneNumber}"></td>
                <td th:text="${user.userEmail}"></td>
                <td th:text="${user.userBirth}"></td>
                <td th:text="${user.userPoint}"></td>
                <td th:text="${user.userStatus}"></td>
                <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${user.lastLoginAt != null ? #temporals.format(user.lastLoginAt, 'yyyy-MM-dd HH:mm') : 'N/A'}"></td>
                <td th:text="${user.userGradeName}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav aria-label="Page navigation" class="d-flex justify-content-center">
        <ul class="pagination">
            <li class="page-item" th:classappend="${!page.hasPrevious()} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/users(page=${page.number - 1}, size=${page.size})}"
                   th:if="${page.hasPrevious()}">이전</a>
                <span class="page-link" th:unless="${page.hasPrevious()}">이전</span>
            </li>
            <li class="page-item active">
                <span class="page-link">
                    현재 페이지: <span th:text="${page.number + 1}">1</span>
                </span>
            </li>
            <li class="page-item" th:classappend="${!page.hasNext()} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/users(page=${page.number + 1}, size=${page.size})}"
                   th:if="${page.hasNext()}">다음</a>
                <span class="page-link" th:unless="${page.hasNext()}">다음</span>
            </li>
        </ul>
    </nav>

    <div class="d-flex justify-content-end mt-3">

        <a th:href="@{/admin/users/bulk/status}">
            <button type="button" class="btn btn-success">유저 상태 변경 테스트 버튼</button>
        </a>

        <a th:href="@{/admin}">
            <button type="button" class="btn btn-success">관리자페이지</button>
        </a>
        <a href="javascript:history.back()" class="btn btn-outline-secondary">
            뒤로가기
        </a>
    </div>
</div>

<!-- Bootstrap 5 JS (필요 시) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
