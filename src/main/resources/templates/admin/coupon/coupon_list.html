<html lang="ko" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/layout}">
<head>
    <title>쿠폰 정책 목록</title>
    <style layout:fragment="css">
        /* 추가적인 CSS가 필요하면 여기에 작성 */
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="container mt-5">
        <h1 class="mb-4">쿠폰 정책 목록</h1>

        <div id="messageContainer" class="alert" style="display: none;" role="alert"></div>

        <div class="mb-3">
            <a th:href="@{/admin/coupons/create}" class="btn btn-primary">새 쿠폰 정책 생성</a>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>쿠폰 이름</th>
                        <th>할인 유형</th>
                        <th>할인 금액</th>
                        <th>적용 범위</th>
                        <th>만료일</th>
                        <th>생성일</th>
                        <th>액션</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="coupon : ${couponPolicies}">
                        <td th:text="${coupon.couponId}"></td>
                        <td th:text="${coupon.couponName}"></td>
                        <td th:text="${coupon.couponDiscountType}"></td>
                        <td th:text="${coupon.couponDiscountAmount}"></td>
                        <td th:text="${coupon.couponScope}"></td>
                        <td th:text="${coupon.couponExpiredAt}"></td>
                        <td th:text="${coupon.couponCreatedAt}"></td>
                        <td>
                            <a th:href="@{/admin/coupons/{id}(id=${coupon.couponId})}" class="btn btn-info btn-sm">상세 보기</a>
                            <form th:action="@{/admin/coupons/{id}/delete(id=${coupon.couponId})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('정말로 이 쿠폰 정책을 삭제하시겠습니까?');">삭제</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script layout:fragment="script">
        const messageContainer = document.getElementById('messageContainer');
        const urlParams = new URLSearchParams(window.location.search);

        if (urlParams.has('success') && urlParams.get('success') === 'true') {
            messageContainer.textContent = '쿠폰이 성공적으로 생성되었습니다!';
            messageContainer.classList.add('alert-success');
            messageContainer.style.display = 'block';
            setTimeout(() => {
                messageContainer.style.display = 'none';
                history.replaceState({}, document.title, window.location.pathname);
            }, 5000);
        } else if (urlParams.has('deleted') && urlParams.get('deleted') === 'true') {
            messageContainer.textContent = '쿠폰이 성공적으로 삭제되었습니다!';
            messageContainer.classList.add('alert-warning');
            messageContainer.style.display = 'block';
            setTimeout(() => {
                messageContainer.style.display = 'none';
                history.replaceState({}, document.title, window.location.pathname);
            }, 5000);
        }
    </script>
</div>
</body>
</html>
