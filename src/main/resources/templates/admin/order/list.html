<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title layout:fragment="title">관리자 주문 조회</title>
</head>
<div layout:fragment="content" class="container py-5 flex-grow-1">
    <div class="text-center mb-5">
        <h2 class="h2 fw-bold">주문 조회</h2>
        <hr>
    </div>

    <div class="table-responsive shadow rounded">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>주문일</th>
                <th>주문번호</th>
                <th>수령인</th>
                <th>총 금액</th>
                <th>상태</th>
                <th>관리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders.content}">
                <td th:text="${order.orderDate}"></td>
                <td th:text="${order.orderNumber}"></td>
                <td th:text="${order.receiverName}"></td>
                <td th:text="${#numbers.formatInteger(order.totalPrice, 3, 'COMMA')} + '원'"></td>
                <td>
                    <span class="badge bg-primary" th:text="${order.status}"></span>
                </td>
                <td>
                    <button type="button" th:if="${order.status == 'PENDING_PAY'}" class="btn btn-success btn-sm change-order-status-btn"
                            th:data-order-number="${order.orderNumber}">배송 시작</button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 데이터가 없을 때 메시지 -->
    <div th:if="${orders.totalElements == 0}" class="alert alert-info text-center">
        <h5>주문이 없습니다.</h5>
    </div>

    <!-- 페이지네이션 -->
    <nav aria-label="Page navigation" class="d-flex justify-content-center mt-4">
        <ul class="pagination">
            <li class="page-item" th:classappend="${orders.number / 10 eq 0} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/orders(page=${T(java.lang.Math).max(0, (orders.number / 10 * 10) - 10)}, size=${orders.size})}" aria-label="Previous 10">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>
            <li class="page-item" th:classappend="${orders.number eq 0} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/orders(page=${orders.number - 1}, size=${orders.size})}" aria-label="Previous">
                    <span aria-hidden="true">&lt;</span>
                </a>
            </li>

            <li class="page-item" th:each="i : ${#numbers.sequence(T(java.lang.Math).max(0, orders.number / 10 * 10), T(java.lang.Math).min((orders.number / 10 * 10) + 9, orders.totalPages - 1))}"
                th:classappend="${i == orders.number} ? 'active'">
                <a class="page-link" th:href="@{/admin/orders(page=${i}, size=${orders.size})}" th:text="${i + 1}">1</a>
            </li>

            <li class="page-item" th:classappend="${orders.number eq orders.totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/orders(page=${orders.number + 1}, size=${orders.size})}" aria-label="Next">
                    <span aria-hidden="true">&gt;</span>
                </a>
            </li>
            <li class="page-item" th:classappend="${(orders.number / 10 * 10) + 9 >= orders.totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/orders(page=${(orders.number / 10 * 10) + 10}, size=${orders.size})}" aria-label="Next 10">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="d-flex justify-content-end mt-4">
        <a th:href="@{/admin}" class="btn btn-secondary">관리자 페이지</a>
    </div>
</div>

<script layout:fragment="scripts">
    document.addEventListener('DOMContentLoaded', function() {
        document.addEventListener('click', async function(event) {
            if (event.target.classList.contains('change-order-status-btn')) {
                const button = event.target;
                const orderNumber = button.getAttribute('data-order-number');
                if (confirm('정말 배송을 시작하시겠습니까?')) {
                    try {
                        const response = await fetch(`/admin/orders/${orderNumber}/status`, {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json'
                            }
                        });

                        if (response.ok) {
                            alert('주문 상태가 성공적으로 변경되었습니다.');
                            location.reload();
                        } else {
                            const errorText = await response.text();
                            alert('주문 상태 변경 실패: ' + errorText);
                        }
                    } catch (error) {
                        console.error('Error during order status change:', error);
                        alert('주문 상태 변경 중 오류가 발생했습니다.');
                    }
                }
            }
        });
    });
</script>
</html>
