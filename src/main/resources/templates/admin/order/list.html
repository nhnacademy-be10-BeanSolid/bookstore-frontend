<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 주문 조회</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">주문 조회</h1>
    <div class="mb-3">
        <a th:href="@{/admin}" class="btn btn-secondary">관리자 페이지</a>
    </div>
    
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>주문일</th>
                <th>주문번호</th>
                <th>수령인</th>
                <th>총 금액</th>
                <th>상태</th>
                <th>관리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders.content}">
                <td th:text="${order.orderDate}"></td>
                <td th:text="${order.orderNumber}"></td>
                <td th:text="${order.receiverName}"></td>
                <td th:text="${#numbers.formatInteger(order.totalPrice, 3, 'COMMA')} + '원'"></td>
                <td>
                    <span class="badge bg-primary" th:text="${order.status}"></span>
                </td>
                <td>
                    <form th:if="${order.status == 'PENDING'}" th:action="@{/admin/orders/{orderNumber}/status(orderNumber=${order.orderNumber})}" method="post">
                        <input type="hidden" name="_method" value="PUT">
                        <button type="submit" class="btn btn-success btn-sm">배송 시작</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 데이터가 없을 때 메시지 -->
    <div th:if="${orders.totalElements == 0}" class="alert alert-info text-center">
        <h5>주문이 없습니다.</h5>
    </div>

    <!-- 페이지네이션 -->
    <nav aria-label="주문 목록 페이지네이션" th:if="${orders.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${!orders.hasPrevious()} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/orders(page=${orders.number - 1}, size=${orders.size})}" aria-label="이전">
                    <span aria-hidden="true">&laquo; 이전</span>
                </a>
            </li>
            <li class="page-item disabled">
                <span class="page-link">
                    현재 페이지: <span th:text="${orders.number + 1}">1</span> / <span th:text="${orders.totalPages}">1</span>
                </span>
            </li>
            <li class="page-item" th:classappend="${!orders.hasNext()} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/orders(page=${orders.number + 1}, size=${orders.size})}" aria-label="다음">
                    <span aria-hidden="true">다음 &raquo;</span>
                </a>
            </li>
        </ul>
    </nav>
</div>
<!-- Bootstrap JS (optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
