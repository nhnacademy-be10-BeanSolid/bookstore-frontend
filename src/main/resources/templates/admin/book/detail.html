<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title layout:fragment="title" th:text="${book.title} + ' - 도서 상세 정보'"></title>
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor-viewer.min.css" />
</head>

<div layout:fragment="content" class="container py-5 flex-grow-1">
    <div class="text-center mb-5">
        <h1 class="h2 fw-bold" th:text="${book.title}"></h1>
        <p class="text-muted">도서 상세 정보</p>
        <hr>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <div class="row g-4">
                <div class="col-md-4 text-center">
                    <img th:src="${book.image}" alt="책 표지" class="img-fluid rounded shadow-sm" style="max-height: 400px;">
                </div>
                <div class="col-md-8">
                    <h3 class="card-title mb-3" th:text="${book.title}"></h3>
                    <p class="card-text text-muted" th:text="${book.author} + ' / ' + ${book.publisher}"></p>
                    <hr>
                    <div class="row">
                        <div class="col-sm-6">
                            <p><strong>ISBN:</strong> <span th:text="${book.isbn}"></span></p>
                            <p><strong>출판일:</strong> <span th:text="${book.publishAt}"></span></p>
                            <p><strong>정가:</strong> <span th:text="${#numbers.formatInteger(book.originalPrice, 3, 'COMMA')} + '원'"></span></p>
                            <p><strong>판매가:</strong> <span class="text-danger fw-bold" th:text="${#numbers.formatInteger(book.salePrice, 3, 'COMMA')} + '원'"></span></p>
                        </div>
                        <div class="col-sm-6">
                            <p><strong>재고:</strong> <span th:text="${book.stock} + ' 권'"></span></p>
                            <p><strong>포장:</strong> <span th:text="${book.wrappable ? '가능' : '불가능'}"></span></p>
                            <p><strong>상태:</strong> <span class="badge bg-success" th:text="${book.status}"></span></p>
                        </div>
                    </div>
                    <div class="mt-3">
                        <strong>카테고리:</strong>
                        <span th:each="category : ${book.bookCategories}" class="badge bg-primary me-1" th:text="${category.categoryName}"></span>
                    </div>
                    <div class="mt-2">
                        <strong>태그:</strong>
                        <span th:each="tag : ${book.bookTags}" class="badge bg-info text-dark me-1" th:text="${tag.tagName}"></span>
                    </div>
                </div>
            </div>

            <hr class="my-4">

            <div>
                <h4 class="mb-3">목차</h4>
                <div class="p-3 bg-light rounded" th:text="${book.toc}" style="white-space: pre-wrap;"></div>
            </div>

            <div class="mt-4">
                <h4 class="mb-3">설명</h4>
                <div id="viewer"></div>
                <div id="hiddenDescription" th:utext="${book.description}" style="display: none;"></div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
                <a th:href="@{/admin/books/{id}/edit(id=${book.id})}" class="btn btn-outline-primary">수정</a>
                <form th:action="@{/admin/books/{id}(id=${book.id})}" method="post" th:onsubmit="return confirm('정말 삭제하시겠습니까?');" class="d-inline">
                    <input type="hidden" name="_method" value="delete" />
                    <button type="submit" class="btn btn-outline-danger">삭제</button>
                </form>
                <a href="/admin/books" class="btn btn-secondary">목록으로</a>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="scripts">
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const descriptionContent = document.getElementById('hiddenDescription').innerHTML;
        const viewer = toastui.Editor.factory({
            el: document.querySelector('#viewer'),
            viewer: true,
            initialValue: descriptionContent
        });
        /*]]>*/
    </script>
</div>
</html>
