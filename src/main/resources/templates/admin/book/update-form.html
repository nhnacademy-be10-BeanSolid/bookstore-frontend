<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title layout:fragment="title" th:text="'도서 수정 - ' + ${book.title}">도서 수정</title>
</head>
<th:block layout:fragment="content">
<div class="container py-5 flex-grow-1">
    <div class="text-center mb-5">
        <h2 class="h2 fw-bold" th:text="'도서 수정: ' + ${book.title}">도서 수정</h2>
        <hr>
    </div>
    <div class="row justify-content-center">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-body">
                    <form th:action="@{/admin/books/{id}(id=${bookId})}" method="post">
                        <input type="hidden" name="_method" value="put" />

                        <div class="mb-3">
                            <label class="form-label">제목</label>
                            <input type="text" name="title" th:value="${book.title}" maxlength="255" required class="form-control"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">이미지</label>
                            <input type="text" name="image" th:value="${book.image}" class="form-control"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">설명</label>
                            <textarea name="description" id="description" style="display: none;" th:text="${book.description}"></textarea>
                            <div id="editor"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">목차</label>
                            <textarea name="toc" rows="4" class="form-control" th:text="${book.toc}"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">저자</label>
                            <input type="text" name="author" th:value="${book.author}" maxlength="255" required class="form-control"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">출판사</label>
                            <input type="text" name="publisher" th:value="${book.publisher}" maxlength="255" required class="form-control"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">출판일</label>
                            <input type="date" name="publishAt" th:value="${book.publishAt}" required class="form-control"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">원가</label>
                            <input type="number" name="originalPrice" th:value="${book.originalPrice}" min="1" required class="form-control"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">판매가</label>
                            <input type="number" name="salePrice" th:value="${book.salePrice}" min="1" required class="form-control"/>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" name="wrappable" th:checked="${book.wrappable}" class="form-check-input" id="wrappable"/>
                            <label class="form-check-label" for="wrappable">포장 가능 여부</label>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">재고</label>
                            <input type="number" name="stock" th:value="${book.stock}" min="0" required class="form-control"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">책 상태</label>
                            <select name="status" class="form-select">
                                <option th:value="'ON_SALE'" th:selected="${book.status == 'ON_SALE'}">판매중</option>
                                <option th:value="'SALE_END'" th:selected="${book.status == 'SALE_END'}">판매종료</option>
                            </select>
                        </div>
                        <div class="d-flex gap-2 justify-content-end">
                            <button type="submit" class="btn btn-primary">수정 완료</button>
                            <a href="/admin/books" class="btn btn-secondary">목록으로</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</th:block>

<th:block layout:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const editor = new toastui.Editor({
                el: document.querySelector('#editor'),
                height: '400px',
                initialEditType: 'wysiwyg',
                previewStyle: 'vertical',
                initialValue: document.getElementById('description').value, // 기존 설명 값 넣기
            });

            document.querySelector('form').addEventListener('submit', function () {
                document.getElementById('description').value = editor.getHTML();
            });
        });
    </script>
</th:block>
</html>
