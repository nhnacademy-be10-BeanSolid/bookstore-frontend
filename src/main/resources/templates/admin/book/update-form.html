<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'도서 수정 - ' + ${book.title}">도서 수정</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Toast UI Editor CSS -->
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
</head>
<body>
<div class="container my-5" style="max-width: 700px;">
    <h1 class="mb-4" th:text="'도서 수정: ' + ${book.title}">도서 수정</h1>
    <form th:action="@{/admin/books/{id}(id=${bookId})}" method="post">
        <input type="hidden" name="_method" value="put" />

        <div class="mb-3">
            <label class="form-label">제목</label>
            <input type="text" name="title" th:value="${book.title}" required class="form-control"/>
        </div>
        <div class="mb-3">
            <label class="form-label">이미지</label>
            <input type="text" name="image" th:value="${book.image}" required class="form-control"/>
        </div>
        <div class="mb-3">
            <label class="form-label">설명</label>
            <input type="hidden" name="description" id="description" th:value="${book.description}"/>
            <div id="editor"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">목차</label>
            <textarea name="toc" rows="4" class="form-control" th:text="${book.toc}"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">저자</label>
            <input type="text" name="author" th:value="${book.author}" required class="form-control"/>
        </div>
        <div class="mb-3">
            <label class="form-label">출판사</label>
            <input type="text" name="publisher" th:value="${book.publisher}" required class="form-control"/>
        </div>
        <div class="mb-3">
            <label class="form-label">출판일</label>
            <input type="date" name="publishAt" th:value="${book.publishAt}" class="form-control"/>
        </div>
        <div class="mb-3">
            <label class="form-label">원가</label>
            <input type="number" name="originalPrice" th:value="${book.originalPrice}" min="0" required class="form-control"/>
        </div>
        <div class="mb-3">
            <label class="form-label">판매가</label>
            <input type="number" name="salePrice" th:value="${book.salePrice}" min="0" required class="form-control"/>
        </div>
        <div class="mb-3">
            <label class="form-label">포장 가능 여부</label>
            <select name="wrappable" class="form-select">
                <option th:value="true" th:selected="${book.wrappable}">가능</option>
                <option th:value="false" th:selected="${!book.wrappable}">불가능</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">재고</label>
            <input type="number" name="stock" th:value="${book.stock}" min="0" class="form-control"/>
        </div>
        <div class="mb-3">
            <label class="form-label">책 상태</label>
            <select name="status" class="form-select">
                <option th:value="ON_SALE" th:selected="${book.status == 'ON_SALE'}">판매중</option>
                <option th:value="SALE_END" th:selected="${book.status == 'SALE_END'}">판매종료</option>
            </select>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">수정 완료</button>
            <a href="/admin/books" class="btn btn-secondary">목록으로</a>
        </div>
    </form>
</div>
<!-- Bootstrap JS (optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>

<script>
    // 기존 설명 데이터 가져오기
    const initialDescription = document.getElementById('description').value;

    // 에디터 초기화 (기존 값으로 초기값 설정)
    const editor = new toastui.Editor({
        el: document.querySelector('#editor'),
        height: '400px',
        initialEditType: 'wysiwyg',
        previewStyle: 'vertical',
        initialValue: initialDescription, // 기존 설명 채워 넣기// 미리보기 스타일
        hideModeSwitch: true,
    });

    // 폼 제출 시 hidden input에 에디터 내용 반영
    document.querySelector('form').addEventListener('submit', function () {
        document.getElementById('description').value = editor.getHTML();
    });
</script>
</body>
</html>
