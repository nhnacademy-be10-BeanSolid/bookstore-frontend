<div class="modal fade" id="categoryManageModal" tabindex="-1" aria-labelledby="categoryManageModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="categoryManageModalLabel">카테고리 관리</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="container" style="max-width: 600px;">
                    <h5 class="mb-4" th:text="'도서 ID: ' + ${book.bookId}">도서 ID</h5>

                    <div class="card mb-4">
                        <div class="card-header bg-primary text-white">
                            현재 카테고리 목록
                        </div>
                        <ul class="list-group list-group-flush" id="currentCategoryList">
                            <li class="list-group-item d-flex justify-content-between align-items-center"
                                th:each="category : ${book.categories}">
                                <span th:text="${category.categoryName}"></span>
                                <form th:action="@{/admin/books/{id}/categories/{categoryId}(id=${book.bookId}, categoryId=${category.categoryId})}"
                                      method="post" class="ms-2 delete-category-form">
                                    <input type="hidden" name="_method" value="delete" />
                                    <button type="submit" class="btn btn-danger btn-sm">삭제</button>
                                </form>
                            </li>
                            <li class="list-group-item text-muted" th:if="${#lists.isEmpty(book.categories)}">카테고리가 없습니다.</li>
                        </ul>
                    </div>

                    <div class="card mb-4">
                        <div class="card-header bg-success text-white">
                            카테고리 추가
                        </div>
                        <div class="card-body">
                            <form id="addCategoryForm" th:action="@{/admin/books/{id}/categories(id=${book.bookId})}" method="post" class="row g-2 align-items-center">
                                <div class="col">
                                    <input type="text" name="categoryId" class="form-control" placeholder="카테고리 아이디 입력" required />
                                </div>
                                <div class="col-auto">
                                    <button type="submit" class="btn btn-success">추가</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
            </div>
        </div>
    </div>
</div>
