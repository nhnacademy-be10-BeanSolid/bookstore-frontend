<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 도서 목록</title>
</head>
<body>
<h1>도서 목록</h1>

<table border="1" cellpadding="8" cellspacing="0">
    <thead>
    <tr>
        <th>도서 ID</th>
        <th>제목</th>
        <th>저자</th>
        <th>출판사</th>
        <th>출판일</th>
        <th>상태</th>
        <th>상세 보기</th>
        <th>관리</th>
        <th>삭제</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.id}"></td>
        <td th:text="${book.title}"></td>
        <td th:text="${book.author}"></td>
        <td th:text="${book.publisher}"></td>
        <td th:text="${book.publishAt}"></td>
        <td th:text="${book.status}"></td>
        <td>
            <a th:href="@{/admin/books/{id}(id=${book.id})}">상세</a>
        </td>
        <td>
            <a th:href="@{/admin/books/{id}/tags(id=${book.id})}">태그 관리</a><br/>
            <a th:href="@{/admin/books/{id}/categories(id=${book.id})}">카테고리 관리</a>
        </td>
        <td>
            <form th:action="@{/admin/books/{id}(id=${book.id})}" method="post">
                <input type="hidden" name="_method" value="delete" />
                <button type="submit">삭제</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<a th:href="@{/admin/books/new}" class="btn">등록</a>

<div>
    <a th:if="${page.hasPrevious()}" th:href="@{/admin/books(page=${page.number - 1}, size=${page.size})}">이전</a>
    <span>현재 페이지: <span th:text="${page.number + 1}">1</span></span>
    <a th:if="${page.hasNext()}" th:href="@{/admin/books(page=${page.number + 1}, size=${page.size})}">다음</a>
</div>
</body>
</html>
