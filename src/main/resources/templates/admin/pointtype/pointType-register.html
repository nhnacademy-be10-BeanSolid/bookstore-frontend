<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title layout:fragment="title">포인트타입 등록</title>
</head>
<div layout:fragment="content" class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4">포인트타입 등록</h2>
                    <form th:action="@{/admin/pointtype}" method="post" id="createPointTypeForm">
                        <div class="mb-3">
                            <label for="typeName" class="form-label">적립 유형명</label>
                            <input type="text" class="form-control" id="typeName" name="typeName" maxlength="20" placeholder="예) 신규가입" required>
                            <div class="form-text">최대 20자, 필수 입력</div>
                        </div>
                        <div class="mb-3">
                            <label for="earningPoint" class="form-label">적립 포인트</label>
                            <input type="number" class="form-control" id="earningPoint" name="earningPoint" min="0" placeholder="예) 1000" required>
                            <div class="form-text">0 이상 정수, 필수 입력</div>
                        </div>
                        <div class="mb-3">
                            <label for="earningRate" class="form-label">적립률(%)</label>
                            <input type="number" class="form-control" id="earningRate" name="earningRate" min="0" placeholder="예) 5" required>
                            <div class="form-text">0 이상 정수, 필수 입력</div>
                        </div>
                        <div class="mb-3">
                            <label for="gradeName" class="form-label">등급명</label>
                            <input type="text" class="form-control" id="gradeName" name="gradeName" maxlength="10" placeholder="예) GOLD">
                            <div class="form-text">최대 10자</div>
                        </div>
                        <div class="mb-4">
                            <label for="isActive" class="form-label">활성화 여부</label>
                            <select class="form-select" id="isActive" name="isActive" required>
                                <option value="">활성화 여부 선택</option>
                                <option value="true">활성화</option>
                                <option value="false">비활성화</option>
                            </select>
                            <div class="form-text">필수 선택</div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">등록</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
