<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>포인트 적립 규정 관리</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5">
    <h1 class="mb-4 text-center">포인트 적립 규정 목록</h1>

    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle text-center">
            <thead class="table-light">
            <tr>
                <th>유형 ID</th>
                <th>유형 명</th>
                <th>적립 포인트</th>
                <th>적립 비율</th>
                <th>등급 명</th>
                <th>활성화 여부</th>
                <th>수정</th>
                <th>상태 변경</th>
                <th>삭제</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="pointType : ${pointTypes}">
                <td th:text="${pointType.typeId}"></td>
                <td th:text="${pointType.typeName}"></td>
                <td th:text="${pointType.earningPoint}"></td>
                <td th:text="${pointType.earningRate} + '%'"></td>
                <td th:text="${pointType.gradeName}"></td>
                <td>
                        <span th:text="${pointType.isActive} ? '활성화' : '비활성화'"
                              th:classappend="${pointType.isActive} ? 'text-success' : 'text-secondary'"></span>
                </td>
                <td>
                    <a th:href="@{'/admin/pointtype/' + ${pointType.typeId} + '/edit'}">
                        <button type="button" class="btn btn-outline-primary btn-sm">수정</button>
                    </a>
                </td>
                <td>
                    <form th:action="@{'/admin/pointtype/' + ${pointType.typeId} + '/isactive'}" method="post" class="d-inline">
                        <input type="hidden" name="_method" value="put"/>
                        <button type="submit"
                                class="btn btn-outline-warning btn-sm"
                                th:text="${pointType.isActive} ? '비활성화' : '활성화'"
                                onclick="return confirm('정말 상태를 변경하시겠습니까?');">
                            상태 변경
                        </button>
                    </form>
                </td>
                <td>
                    <form th:action="@{'/admin/pointtype/' + ${pointType.typeId}}" method="post" class="d-inline">
                        <input type="hidden" name="_method" value="delete"/>
                        <button type="submit"
                                class="btn btn-outline-danger btn-sm"
                                onclick="return confirm('정말 삭제하시겠습니까?');">
                            삭제
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="my-4 text-end">
        <a th:href="@{/admin}">
            <button type="button" class="btn btn-success">관리자페이지</button>
        </a>
        <a th:href="@{/admin/pointtype/register}">
            <button type="button" class="btn btn-success">등록</button>
        </a>
    </div>

    <!-- 페이지네이션 -->
    <nav aria-label="Page navigation" class="d-flex justify-content-center">
        <ul class="pagination">
            <li class="page-item" th:classappend="${!page.hasPrevious()} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/templates/admin/pointtype(page=${page.number - 1}, size=${page.size})}"
                   th:if="${page.hasPrevious()}">이전</a>
                <span class="page-link" th:unless="${page.hasPrevious()}">이전</span>
            </li>
            <li class="page-item active">
                <span class="page-link">
                    현재 페이지: <span th:text="${page.number + 1}">1</span>
                </span>
            </li>
            <li class="page-item" th:classappend="${!page.hasNext()} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/templates/admin/pointtype(page=${page.number + 1}, size=${page.size})}"
                   th:if="${page.hasNext()}">다음</a>
                <span class="page-link" th:unless="${page.hasNext()}">다음</span>
            </li>
        </ul>
    </nav>

    <!-- 알림 팝업 -->
    <script th:if="${registerSuccess != null}">
        alert('[[${registerSuccess}]]');
    </script>
    <script th:if="${registerFail != null}">
        alert('[[${registerFail}]]');
    </script>
    <script th:if="${deleteSuccess != null}">
        alert('[[${deleteSuccess}]]');
    </script>
    <script th:if="${deleteFail != null}">
        alert('[[${deleteFail}]]');
    </script>
    <script th:if="${changeSuccess != null}">
        alert('[[${changeSuccess}]]');
    </script>
    <script th:if="${editSuccess != null}">
        alert('[[${editSuccess}]]');
    </script>
</div>
<!-- Bootstrap JS (optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
