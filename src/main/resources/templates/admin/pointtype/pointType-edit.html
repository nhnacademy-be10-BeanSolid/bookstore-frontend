<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>포인트타입 수정</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4">포인트타입 수정</h2>
                    <form th:action="@{'/admin/pointtype/' + ${responsePointType.typeId} + '/edit'}" method="post" class="d-inline">
                        <input type="hidden" name="_method" value="put"/>

                        <div class="mb-3">
                            <label for="typeName" class="form-label">적립 유형명</label>
                            <input type="text" class="form-control" id="typeName" name="typeName"
                                   maxlength="20" placeholder="예) 신규가입" required
                                   th:value="${responsePointType.typeName}">
                            <div class="form-text">최대 20자, 필수 입력</div>
                        </div>
                        <div class="mb-3">
                            <label for="earningPoint" class="form-label">적립 포인트</label>
                            <input type="number" class="form-control" id="earningPoint" name="earningPoint"
                                   min="0" placeholder="예) 1000" required
                                   th:value="${responsePointType.earningPoint}">
                            <div class="form-text">0 이상 정수, 필수 입력</div>
                        </div>
                        <div class="mb-3">
                            <label for="earningRate" class="form-label">적립률(%)</label>
                            <input type="number" class="form-control" id="earningRate" name="earningRate"
                                   min="0" placeholder="예) 5" required
                                   th:value="${responsePointType.earningRate}">
                            <div class="form-text">0 이상 정수, 필수 입력</div>
                        </div>
                        <div class="mb-4">
                            <label for="gradeName" class="form-label">등급명</label>
                            <input type="text" class="form-control" id="gradeName" name="gradeName"
                                   maxlength="10" placeholder="예) GOLD"
                                   th:value="${responsePointType.gradeName}">
                            <div class="form-text">최대 10자</div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">수정하기</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Bootstrap JS (선택) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
